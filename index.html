imento e risali estendendo ginocchia e fianchi spingendo sui talloni, spingendo contemporaneamente i kettlebell sopra la testa distendendo le braccia, sfruttando lo slancio dello squat.","All'inizio della ripetizione successiva, riporta i pesi alle spalle."],"Sfrutta lo slancio della salita dallo squat per aiutare la spinta sopra la testa, mantenendo la schiena eretta durante tutto il movimento."],["Knee_Hip_Raise_On_Parallel_Bars","Sollevamenti ginocchia alle parallele","Addome","Altro",0.667,["Posizionati sulla panca per sollevamento gambe con gli avambracci appoggiati sui cuscinetti accanto al busto, mani sulle maniglie, gomiti piegati a 90 gradi.","Tieni il busto dritto, la parte bassa della schiena premuta contro il cuscinetto e le gambe distese verso il pavimento: questa è la posizione di partenza.","Espirando, solleva le gambe tenendole distese finché non sono all'incirca parallele al pavimento, tenendo la contrazione un secondo.","Torna lentamente alla posizione di partenza inspirando.","Ripeti per il numero di ripetizioni previsto."],"Non usare slancio o oscillazioni: mantieni il busto fermo e la schiena premuta sul cuscinetto durante il movimento."],["Lateral_Raise_-_With_Bands","Alzate laterali con elastico","Spalle","Elastici",0.667,["Metti i piedi sull'elastico in modo che la tensione inizi a braccia tese e afferra le maniglie con presa prona, leggermente più stretta delle spalle, maniglie ai lati delle cosce, braccia tese con leggera flessione ai gomiti e schiena dritta: questa è la posizione di partenza.","Usa le spalle laterali per sollevare le maniglie ai lati mentre espiri, finché non sono leggermente sopra il parallelo, inclinando leggermente il polso come se versassi dell'acqua e mantenendo le braccia tese.","Abbassa lentamente le maniglie alla posizione di partenza inspirando.","Ripeti per il numero di ripetizioni previsto, tenendo il busto fermo e facendo una pausa di un secondo in alto."],"Mantieni il busto fermo senza oscillare, usando solo le spalle per sollevare l'elastico."],["Leg_Extensions","Leg extension","Quadricipiti","Macchina",0.667,["Siediti sulla leg extension con le gambe sotto il cuscinetto e le mani sui braccioli laterali.","Regola il cuscinetto in modo che appoggi appena sopra i piedi e verifica che ginocchio e anca formino un angolo di 90 gradi.","Estendi le gambe al massimo espirando, mantenendo il busto fermo sul sedile e una breve pausa in contrazione.","Abbassa lentamente il peso inspirando, senza superare l'angolo di 90 gradi.","Ripeti per il numero di ripetizioni previsto."],"Non superare l'angolo di 90 gradi tra gamba e coscia per evitare stress eccessivo sul ginocchio."],["Leg_Press","Leg press","Quadricipiti","Macchina",0.667,["Siediti alla leg press e posiziona i piedi sulla pedana a larghezza spalle.","Sblocca le sicure e spingi la pedana fino a estendere completamente le gambe, senza bloccare le ginocchia.","Inspirando, abbassa lentamente la pedana finché coscia e gamba formano un angolo di 90 gradi.","Spingendo soprattutto con i talloni, torna alla posizione di partenza espirando.","Ripeti per le ripetizioni previste e blocca sempre le sicure a fine serie."],"Non bloccare le ginocchia a fine spinta e ricorda sempre di inserire le sicure quando finisci."],["Leverage_Chest_Press","Chest press convergente (macchina)","Petto","Macchina",0.667,["Carica il peso e regola il sedile in modo che le maniglie siano all'altezza dei pettorali.","Tieni il petto in fuori, la testa alta e le scapole retratte: questa è la posizione di partenza.","Spingi le maniglie in avanti estendendo i gomiti.","Dopo una breve pausa in massima estensione, torna lentamente senza rilasciare completamente il peso."],"Mantieni le scapole retratte e il petto in fuori per proteggere le spalle durante la spinta."],["Leverage_High_Row","Rematore alto alla macchina","Dorso","Macchina",0.667,["Carica il peso e regola il sedile in modo da raggiungere comodamente le maniglie sopra la testa, bloccando le ginocchia sotto l'apposito cuscinetto.","Afferra le maniglie con presa prona: questa è la posizione di partenza.","Tira le maniglie verso il busto retraendo le scapole mentre pieghi i gomiti.","Fai una pausa a fine movimento, poi torna lentamente alla posizione di partenza senza rilasciare del tutto il peso."],"Nelle ripetizioni successive non far tornare il peso a fine corsa, così mantieni la tensione sui muscoli."],["Leverage_Incline_Chest_Press","Chest press inclinata (macchina)","Petto","Macchina",0.667,["Carica il peso e regola il sedile in modo che le maniglie siano all'altezza della parte alta dei pettorali.","Tieni il petto in fuori, la testa alta e le scapole retratte: questa è la posizione di partenza.","Spingi le maniglie in avanti estendendo i gomiti.","Dopo una breve pausa in massima estensione, torna lentamente senza rilasciare completamente il peso."],"Mantieni petto alto e scapole retratte per coinvolgere al meglio la parte superiore dei pettorali."],["Leverage_Iso_Row","Rematore alla macchina","Dorsali","Macchina",0.667,["Carica il peso e regola il sedile in modo che le maniglie siano all'altezza del petto.","Afferra le maniglie con presa neutra o prona: questa è la posizione di partenza.","Tira le maniglie verso il busto retraendo le scapole mentre pieghi i gomiti.","Fai una pausa a fine movimento e torna lentamente alla partenza, senza rilasciare del tutto il peso tra le ripetizioni."],"Non lasciare tornare il peso a fine corsa tra le ripetizioni, per mantenere la tensione sui muscoli target."],["Leverage_Shoulder_Press","Shoulder press convergente (macchina)","Spalle","Macchina",0.667,["Carica il peso e regola il sedile in modo che le maniglie siano all'altezza delle spalle.","Afferra le maniglie con presa prona, petto in fuori e testa alta: questa è la posizione di partenza.","Spingi le maniglie verso l'alto estendendo i gomiti.","Dopo una breve pausa in alto, torna lentamente senza rilasciare completamente il peso."],"Mantieni il petto alto durante tutta la spinta per non scaricare lo sforzo sulla parte bassa della schiena."],["Low_Cable_Crossover","Croci ai cavi dal basso","Petto","Cavi",0.667,["Posiziona le carrucole in basso, scegli il carico e afferra una maniglia per mano.","Fai un passo avanti per mettere in tensione i cavi, con palmi in avanti, mani sotto la vita e braccia tese: questa è la posizione di partenza.","Con un leggero piegamento dei gomiti, porta le mani verso l'alto e verso il centro del corpo fino a farle incontrare davanti al petto.","Dopo una breve pausa, riporta le braccia alla posizione di partenza."],"Mantieni un leggero piegamento dei gomiti per tutto il movimento e concentra lo sforzo sul petto, non sulle spalle."],["Lying_Dumbbell_Tricep_Extension","French press con manubri","Tricipiti","Manubri",0.667,["Sdraiati su una panca piana con un manubrio per mano, braccia tese a 90 gradi rispetto al busto, palmi rivolti verso l'interno e gomiti raccolti: questa è la posizione di partenza.","Inspirando, tenendo ferme le braccia e i gomiti raccolti, abbassa lentamente i pesi finché i manubri arrivano vicino alle orecchie.","Usando i tricipiti, riporta il peso in alto espirando, mantenendo i gomiti fermi.","Ripeti per il numero di ripetizioni previsto."],"Tieni i gomiti fermi e puntati verso l'alto per isolare i tricipiti ed evitare tensioni alla spalla."],["Lying_Leg_Curls","Leg curl sdraiato","Femorali","Macchina",0.667,["Regola la leva della macchina alla tua altezza e sdraiati a pancia in giù con il cuscinetto appena sopra i polpacci.","Tieni il busto piatto sulla panca, le gambe distese e afferra le maniglie laterali: questa è la posizione di partenza.","Espirando, piega le gambe il più possibile senza sollevare le cosce dal cuscinetto, tenendo la contrazione per un secondo.","Inspirando, riporta le gambe alla posizione iniziale e ripeti per le ripetizioni previste."],"Non sollevare le cosce dal cuscinetto durante il movimento per lavorare in modo isolato sui femorali."],["Lying_T-Bar_Row","Rematore T-bar su panca","Dorso","Macchina",0.667,["Carica il T-bar row e regola l'altezza in modo che il petto arrivi in cima al cuscinetto.","Sdraiati a pancia in giù sul cuscinetto e afferra le maniglie con la presa scelta.","Solleva il bilanciere dal supporto ed estendi le braccia davanti a te: questa è la posizione di partenza.","Espirando, tira lentamente il peso verso l'alto stringendo la schiena in contrazione, tenendo le braccia vicine al busto.","Dopo una pausa in contrazione, inspira e torna lentamente alla posizione di partenza.","Ripeti per il numero di ripetizioni previsto."],"Non staccare il busto dal cuscinetto e non aiutarti con i bicipiti: la trazione deve venire dalla schiena."],["Machine_Bench_Press","Chest press (macchina)","Petto","Macchina",0.667,["Siediti alla chest press e seleziona il peso.","Usa la leva della macchina per portare avanti le maniglie, afferrale ed estendi completamente le braccia.","Afferra le maniglie a presa prona con i gomiti all'altezza delle spalle: questa è la posizione di partenza.","Inspirando, porta le maniglie verso di te.","Espirando, spingi le maniglie in avanti contraendo i pettorali e mantieni la contrazione per un secondo.","Ripeti per le ripetizioni previste e a fine serie riporta lentamente le maniglie in posizione con la leva."],"Contrai bene i pettorali in massima estensione prima di tornare alla posizione di partenza."],["Machine_Bicep_Curl","Curl bicipiti (macchina)","Bicipiti","Macchina",0.667,["Regola il sedile all'altezza corretta, seleziona il peso e appoggia le braccia sui cuscinetti afferrando le maniglie: questa è la posizione di partenza.","Piega i gomiti portando l'avambraccio verso il braccio.","Fai una pausa in contrazione, poi torna lentamente alla posizione di partenza.","Non lasciare tornare il peso completamente a fine corsa fino al termine della serie."],"Mantieni i gomiti appoggiati e fermi sul cuscinetto per isolare il lavoro sui bicipiti."],["Machine_Preacher_Curls","Curl alla panca Scott (macchina)","Bicipiti","Macchina",0.667,["Siediti alla panca Scott a macchina e seleziona il peso.","Appoggia la parte posteriore delle braccia sul cuscinetto e afferra le maniglie con presa supina, tenendo i gomiti raccolti: questa è la posizione di partenza.","Espirando, solleva le maniglie contraendo i bicipiti e tieni la contrazione per un secondo in alto.","Inspirando, abbassa lentamente le maniglie alla posizione di partenza.","Ripeti per il numero di ripetizioni previsto."],"Muovi solo gli avambracci: la parte superiore delle braccia deve restare ferma sul cuscinetto."],["Machine_Shoulder_Military_Press","Shoulder press (macchina)","Spalle","Macchina",0.667,["Siediti alla shoulder press a macchina e seleziona il peso.","Afferra le maniglie ai lati con i gomiti piegati in linea con il busto: questa è la posizione di partenza.","Espirando, spingi le maniglie in alto estendendo completamente le braccia e tieni la contrazione per un secondo.","Inspirando, abbassa lentamente le maniglie alla posizione di partenza.","Ripeti per il numero di ripetizioni previsto."],"Mantieni i gomiti allineati al busto durante la spinta per proteggere le spalle."],["Machine_Triceps_Extension","Estensioni tricipiti (macchina)","Tricipiti","Macchina",0.667,["Regola il sedile all'altezza corretta, seleziona il peso e appoggia le braccia sui cuscinetti afferrando le maniglie: questa è la posizione di partenza.","Estendi i gomiti allontanando l'avambraccio dal braccio.","Fai una pausa a fine movimento, poi torna lentamente alla posizione di partenza.","Non lasciare tornare il peso completamente a fine corsa fino al termine della serie."],"Mantieni i gomiti fermi contro il cuscinetto per isolare bene il lavoro sui tricipiti."],["Mountain_Climbers","Mountain climber","Quadricipiti","Altro",0.667,["Parti in posizione di plank alto, con il peso su mani e punte dei piedi.","Piega ginocchio e anca portando un piede sotto il bacino: questa è la posizione di partenza.","Cambia rapidamente gamba, estendendo quella piegata e portando l'altro ginocchio in avanti.","Ripeti in modo alternato per 20-30 secondi."],"Mantieni il bacino stabile e l'addome contratto per non far ondeggiare il busto durante il ritmo veloce."],["Narrow_Stance_Leg_Press","Leg press piedi stretti","Quadricipiti","Macchina",0.667,["Siediti alla leg press e posiziona i piedi vicini, a meno della larghezza delle spalle, punte leggermente aperte.","Sblocca le sicure e spingi la pedana fino a estendere completamente le gambe, senza bloccare le ginocchia.","Inspirando, abbassa lentamente la pedana finché coscia e gamba formano un angolo di 90 gradi.","Spingendo soprattutto con i talloni, torna alla posizione di partenza espirando.","Ripeti per le ripetizioni previste e blocca sempre le sicure a fine serie."],"Tieni sempre la testa alta e la schiena appoggiata al sedile durante tutto il movimento."],["Oblique_Crunches","Crunch obliqui","Addome","Corpo libero",0.667,["Sdraiati sulla schiena con la zona lombare a contatto col pavimento, una mano dietro la testa e l'altra appoggiata a terra.","Tieni i piedi sollevati e appoggiati su una superficie piana.","Solleva la spalla dal lato della mano dietro la testa insieme al busto, portando il gomito verso il ginocchio opposto.","Dopo il contatto tra gomito e ginocchio, torna lentamente alla posizione di partenza espirando in salita e inspirando in discesa.","Alterna i due lati per il numero di ripetizioni previsto."],"Muovi il busto in diagonale verso il ginocchio opposto per coinvolgere davvero gli obliqui."],["One-Arm_Dumbbell_Row","Rematore con manubrio a un braccio","Dorso","Manubri",0.667,["Metti un ginocchio e la mano corrispondente sulla panca piana, busto parallelo al pavimento e schiena dritta.","Afferra il manubrio con l'altra mano, palmo rivolto verso il busto: questa è la posizione di partenza.","Espirando, tira il manubrio verso il fianco tenendo il gomito vicino al corpo e il busto fermo.","Inspirando, abbassa il manubrio in modo controllato fino alla posizione di partenza.","Ripeti per le ripetizioni previste, poi cambia braccio."],"Fai lavorare la schiena, non le braccia: tieni il busto fermo e concentra la trazione sui dorsali."],["One-Arm_Kettlebell_Swings","Kettlebell swing a un braccio","Femorali","Kettlebell",0.669,["Metti i piedi a larghezza spalle con il kettlebell a terra davanti a te e afferralo con una mano.","Piega leggermente le ginocchia e spingi i fianchi indietro per caricare l'oscillazione: questa è la posizione di partenza.","Spingi con decisione i fianchi in avanti per far oscillare il kettlebell fino all'altezza delle spalle.","Lascia ricadere il kettlebell tra le gambe controllando il movimento e ripeti il gesto in modo fluido.","Ripeti per il numero di ripetizioni previsto, poi cambia braccio."],"La spinta deve partire dai fianchi e non dalle braccia o dalla parte bassa della schiena."],["One-Legged_Cable_Kickback","Kickback glutei ai cavi","Glutei","Cavi",0.667,["Aggancia un cavigliere alla carrucola bassa e fissalo alla caviglia.","Mettiti di fronte alla macchina a circa 60 cm, afferrando la struttura come appoggio.","Con ginocchia leggermente piegate e addome contratto, espirando spingi la gamba indietro in un arco fino al massimo comodo, contraendo il gluteo per un secondo in fondo al movimento.","Riporta lentamente la gamba avanti resistendo alla tensione del cavo fino alla posizione di partenza.","Ripeti per le ripetizioni previste, poi cambia gamba."],"Contrai bene il gluteo in fondo al movimento e mantieni l'addome stabile per non inarcare la schiena."],["One_Arm_Dumbbell_Preacher_Curl","Curl alla panca Scott (manubrio)","Bicipiti","Manubri",0.667,["Afferra un manubrio con una mano e appoggia il braccio sulla panca Scott, manubrio all'altezza della spalla: questa è la posizione di partenza.","Inspirando, abbassa lentamente il manubrio finché il braccio è disteso e il bicipite ben allungato.","Espirando, usa il bicipite per risollevare il peso fino alla massima contrazi ."],"Non lasciare cadere i fianchi: mantieni il corpo in linea retta per tutto il movimento."],["Push-Ups_-_Close_Triceps_Position","Piegamenti presa stretta","Tricipiti","Corpo libero",0.667,["Mettiti prono con le mani più vicine della larghezza delle spalle, corpo dritto in appoggio sulle braccia tese.","Inspirando, abbassati finché il petto quasi tocca il pavimento.","Espirando, spingi il busto verso l'alto usando tricipiti e pettorali, contraendo il petto in cima.","Dopo una breve pausa in contrazione, ripeti per il numero di ripetizioni previsto."],"Tieni i gomiti vicini al busto per concentrare il lavoro sui tricipiti."],["Pushups","Piegamenti (push-up)","Petto","Corpo libero",0.667,["Mettiti prono con le mani a circa 90 cm di distanza, corpo dritto in appoggio sulle braccia tese.","Inspirando, abbassati finché il petto quasi tocca il pavimento.","Espirando, spingi il busto verso l'alto contraendo il petto fino alla posizione di partenza.","Dopo una breve pausa in contrazione, ripeti per il numero di ripetizioni previsto."],"Mantieni il corpo in linea retta dalla testa ai talloni per tutta la ripetizione."],["Rack_Pulls","Rack pull","Lombari","Bilanciere",0.667,["Imposta il bilanciere sui perni di un power rack, all'altezza desiderata (sotto o sopra il ginocchio, o a metà coscia).","Mettiti in posizione da stacco con i piedi sotto i fianchi, presa larga quanto le spalle, schiena arcuata e fianchi indietro.","Guardando avanti, estendi anche e ginocchia tirando il peso verso l'alto fino al blocco, riportando le spalle indietro a fine movimento.","Riporta il peso sui perni e ripeti."],"Se il carico è elevato usa una presa mista, uncinata o le straps per proteggere la presa."],["Reverse_Barbell_Curl","Curl inverso con bilanciere","Bicipiti","Bilanciere",0.667,["In piedi con busto eretto, afferra il bilanciere a larghezza spalle con presa prona, gomiti vicini al busto: questa è la posizione di partenza.","Tenendo le braccia ferme, espirando piega gli avambracci contraendo i bicipiti finché la barra arriva all'altezza delle spalle.","Contrai per un secondo, poi inspirando riporta lentamente la barra alla posizione di partenza.","Ripeti per il numero di ripetizioni previsto."],"Muovi solo gli avambracci e mantieni i gomiti fermi contro il busto per tutto il movimento."],["Reverse_Crunch","Crunch inverso","Addome","Corpo libero",0.667,["Sdraiati con le gambe tese e le braccia lungo il busto, palmi a terra: le braccia restano ferme per tutto l'esercizio.","Solleva le gambe finché le cosce sono perpendicolari al pavimento e i piedi paralleli ad esso: questa è la posizione di partenza.","Inspirando, porta le ginocchia verso il petto arrotolando il bacino e sollevando i fianchi da terra.","Contrai per un secondo e torna alla posizione di partenza espirando.","Ripeti per il numero di ripetizioni previsto."],"Il movimento deve arrotolare il bacino verso l'alto, non solo piegare le ginocchia."],["Reverse_Flyes","Alzate posteriori (manubri)","Spalle","Manubri",0.667,["Sdraiati su una panca inclinata con petto e addome contro lo schienale, un manubrio per mano a presa neutra.","Estendi le braccia davanti a te, perpendicolari alla panca: questa è la posizione di partenza.","Con un leggero piegamento dei gomiti, apri le braccia lateralmente in un arco espirando, stringendo le scapole.","Solleva le braccia fino a portarle parallele al pavimento.","Inspirando, abbassa lentamente i manubri fino alla posizione di partenza.","Ripeti per il numero di ripetizioni previsto."],"Stringi bene le scapole in alto per coinvolgere davvero i deltoidi posteriori."],["Reverse_Grip_Bent-Over_Rows","Rematore bilanciere presa supina","Dorso","Bilanciere",0.667,["In piedi, afferra il bilanciere con presa supina.","Piega leggermente le ginocchia e inclina il busto in avanti dai fianchi finché è quasi parallelo al pavimento, con la schiena dritta e la testa alta: questa è la posizione di partenza.","Tenendo il busto fermo, espirando solleva il bilanciere con i gomiti vicini al corpo, contraendo la schiena per un secondo in alto.","Inspirando, abbassa lentamente il peso alla posizione di partenza.","Ripeti per il numero di ripetizioni previsto."],"Tieni la schiena dritta e il busto fermo: la trazione deve venire dalla schiena, non dagli avambracci."],["Reverse_Grip_Triceps_Pushdown","Pushdown tricipiti presa inversa","Tricipiti","Cavi",0.667,["Monta una barra su una carrucola alta.","Afferra la barra con presa supina a larghezza spalle e abbassala fino a braccia tese lungo i fianchi, gomiti stretti al corpo: questa è la posizione di partenza.","Inspirando, solleva lentamente la barra fino all'altezza del petto muovendo solo gli avambracci.","Espirando, riporta la barra giù contraendo bene i tricipiti.","Ripeti per il numero di ripetizioni previsto."],"Tieni i gomiti fermi ai lati del busto per tutto il movimento, senza farli oscillare."],["Reverse_Machine_Flyes","Reverse pec deck (deltoidi posteriori)","Spalle","Macchina",0.667,["Regola le maniglie tutte indietro e il sedile in modo che siano all'altezza delle spalle.","Afferra le maniglie con le mani rivolte verso l'interno: questa è la posizione di partenza.","In un movimento semicircolare, tira le mani lateralmente e indietro contraendo i deltoidi posteriori.","Mantieni un leggero piegamento dei gomiti per tutto il movimento, che deve avvenire solo alla spalla.","Fai una pausa a fine movimento e torna lentamente alla posizione di partenza."],"Lascia che tutto il movimento avvenga all'articolazione della spalla, con i gomiti solo leggermente piegati."],["Romanian_Deadlift","Stacco rumeno","Femorali","Bilanciere",0.667,["Afferra il bilanciere a terra con presa prona poco più larga delle spalle.","Piega leggermente le ginocchia, tibie verticali, fianchi indietro e schiena dritta: questa è la posizione di partenza.","Tenendo braccia e schiena completamente dritte, usa i fianchi per sollevare la barra espirando, con movimento lento e controllato.","Una volta in piedi, abbassa i talloni fuori.","Posiziona le cosce sotto il cuscinetto della leva, regolato alla tua altezza, e tieni le mani sopra il cuscinetto.","Solleva leggermente la leva spingendo sui talloni e rilascia la sicura: questa è la posizione di partenza.","Inspirando, abbassa lentamente i talloni piegando le caviglie finché i polpacci sono ben allungati.","Espirando, solleva i talloni il più possibile contraendo i polpacci e mantieni la contrazione per un secondo.","Ripeti per il numero di ripetizioni previsto."],"Cerca l'allungamento completo in basso e la massima contrazione in alto per ogni ripetizione."],["Seated_Dumbbell_Press","Lento con manubri seduto","Spalle","Manubri",0.667,["Siediti su una panca con schienale con un manubrio per mano appoggiato sulle cosce.","Solleva i manubri uno alla volta fino all'altezza delle spalle aiutandoti con le cosce.","Ruota i polsi in modo che i palmi siano rivolti in avanti: questa è la posizione di partenza.","Espirando, spingi i manubri verso l'alto finché si toccano in cima.","Dopo una pausa di un secondo, inspirando riporta lentamente i manubri alla posizione di partenza.","Ripeti per il numero di ripetizioni previsto."],"Controlla la discesa dei manubri per proteggere le spalle e mantenere tensione sui deltoidi."],["Seated_Leg_Curl","Leg curl seduto","Femorali","Macchina",0.667,["Regola la leva della macchina alla tua altezza e siediti con la schiena contro lo schienale.","Posiziona la parte posteriore della gamba sopra il cuscinetto e blocca le cosce con l'apposito supporto: questa è la posizione di partenza.","Espirando, tira la leva il più possibile verso la parte posteriore delle cosce piegando le ginocchia, con il busto fermo.","Mantieni la contrazione per un secondo, poi torna lentamente alla posizione di partenza inspirando.","Ripeti per il numero di ripetizioni previsto."],"Tieni il busto fermo contro lo schienale per isolare bene il lavoro sui femorali."],["Seated_One-arm_Cable_Pulley_Rows","Pulley basso a un braccio","Dorso","Cavi",0.667,["Siediti alla macchina e appoggia i piedi sulla pedana anteriore, con le ginocchia leggermente piegate e non bloccate.","Piegati in avanti mantenendo la schiena dritta e afferra la maniglia singola con il braccio sinistro, presa prona.","Con il braccio disteso tira indietro finché il busto forma un angolo di 90 gradi con le gambe: questa è la posizione di partenza.","Tenendo il busto fermo, tira la maniglia verso il busto ruotando il polso, così da avere il palmo rivolto verso di te vicino all'addome; espira durante il movimento.","Mantieni la contrazione per un secondo, poi torna lentamente alla posizione di partenza inspirando e ruotando di nuovo il polso.","Ripeti per il numero di ripetizioni previsto, poi esegui lo stesso movimento con il braccio destro."],"Mantieni il busto fermo e i gomiti vicini al corpo, così il lavoro resta sui muscoli della schiena e non sulle braccia."],["Seated_Side_Lateral_Raise","Alzate laterali seduto","Spalle","Manubri",0.667,["Siediti sul bordo di una panca piana con i piedi ben appoggiati a terra, un manubrio in ogni mano e palmi rivolti verso l'interno.","Con il busto fermo, solleva i manubri lateralmente con un leggero piegamento dei gomiti, come se versassi acqua in un bicchiere.","Solleva fino a portare le braccia parallele al pavimento, espirando e facendo una breve pausa in alto.","Abbassa lentamente i manubri inspirando.","Ripeti per il numero di ripetizioni previsto."],"Evita di oscillare il busto: il movimento deve venire solo dalle spalle."],["Seated_Triceps_Press","Estensioni tricipiti seduto","Tricipiti","Manubri",0.667,["Siediti su una panca con schienale e afferra un manubrio con entrambe le mani, tenendolo sopra la testa a braccia tese.","Con la parte superiore delle braccia vicina alla testa e perpendicolare al pavimento, abbassa il peso dietro la nuca finché gli avambracci toccano i bicipiti, inspirando.","Usa i tricipiti per tornare alla posizione di partenza, espirando.","Ripeti per il numero di ripetizioni previsto."],"Muovi solo gli avambracci: la parte superiore delle braccia resta ferma per proteggere i gomiti."],["Side_Bridge","Plank laterale","Addome","Corpo libero",0.667,["Sdraiati su un fianco con le gambe distese una sopra l'altra e appoggiati sull'avambraccio, gomito sotto la spalla.","Solleva i fianchi da terra formando una linea retta tra caviglie, bacino e spalle.","Contrai gli addominali e mantieni la posizione per il tempo previsto, respirando normalmente.","Abbassa lentamente i fianchi a terra e ripeti dall'altro lato."],"Mantieni sempre l'allineamento tra spalle, bacino e caviglie, senza far cadere i fianchi verso il basso."],["Side_Lateral_Raise","Alzate laterali con manubri","Spalle","Manubri",0.667,["In piedi con il busto dritto, tieni un manubrio in ogni mano lungo i fianchi, palmi rivolti verso di te.","Con il busto fermo (senza oscillare), solleva i manubri lateralmente con un leggero piegamento dei gomiti, come se versassi acqua in un bicchiere.","Solleva fino a portare le braccia parallele al pavimento, espirando e facendo una breve pausa in alto.","Abbassa lentamente i manubri inspirando.","Ripeti per il numero di ripetizioni previsto."],"Evita di usare lo slancio della schiena: il movimento deve essere controllato e isolato sulle spalle."],["Single-Leg_Leg_Extension","Leg extension a una gamba","Quadricipiti","Macchina",0.667,["Siediti sulla macchina e regola il cuscinetto contro la parte bassa dello stinco, con il perno in linea con il ginocchio.","Mantenendo una buona postura, estendi completamente una gamba, facendo una pausa in cima al movimento.","Torna alla posizione di partenza senza far fermare il peso, mantenendo tensione sul muscolo.","Ripeti per il numero di ripetizioni previsto, poi cambia gamba."],"Lavora una gamba alla volta per isolare meglio il quadricipite ed evitare compensazioni."],["Single_Leg_Glute_Bridge","Ponte glutei a una gamba","Glutei","Corpo libero",0.667,["Sdraiati a terra con i piedi appoggiati e le ginocchia piegate.","Solleva una gamba da terra portando il ginocchio verso il petto: questa è la posizione di partenza.","Spingi con il tallone dell'altra gamba, estendendo l'anca e sollevando i glutei da terra.","Estendi il più possibile, fai una pausa e torna alla posizione di partenza."],"Spingi attraverso il tallone e mantieni i fianchi allineati, senza ruotare il bacino."],["Sit-Up","Sit-up","Addome","Corpo libero",0.667,["Sdraiati a terra con i piedi bloccati sotto un supporto fisso o tenuti da un compagno, ginocchia piegate.","Metti le mani dietro la testa intrecciando le dita: questa è la posizione di partenza.","Solleva il busto verso le cosce formando una V immaginaria, espirando.","Dopo un secondo di contrazione, torna lentamente alla posizione di partenza inspirando.","Ripeti per il numero di ripetizioni previsto."],"Non tirare il collo con le mani: il movimento deve partire dagli addominali."],["Smith_Machine_Bench_Press","Panca piana (multipower)","Petto","Macchina",0.667,["Posiziona una panca piana sotto il multipower e regola il bilanciere a un'altezza raggiungibile da sdraiato.","Sdraiati sulla panca, afferra il bilanciere con presa prona più larga delle spalle, sganciarlo e tienilo disteso sopra di te a braccia bloccate.","Inspirando, abbassa lentamente il bilanciere fino a sfiorare il centro del petto.","Dopo una breve pausa, spingi il bilanciere verso l'alto usando i pettorali, espirando, e blocca le braccia in alto.","Ripeti per il numero di ripetizioni previsto, poi riaggancia il bilanciere al rack."],"La fase di discesa dovrebbe durare almeno il doppio della fase di spinta, per mantenere il controllo del carico."],["Smith_Machine_Bent_Over_Row","Rematore al multipower","Dorso","Macchina",0.667,["Imposta il bilanciere del multipower a un'altezza di circa 5 cm sotto le ginocchia.","Piega leggermente le ginocchia e inclina il busto in avanti dai fianchi, schiena dritta e testa alta, fino quasi parallelo al pavimento.","Afferra il bilanciere con presa prona, sganciarlo e lascialo pendere a braccia tese: questa è la posizione di partenza.","Con il busto fermo, tira il bilanciere verso l'addome espirando, mantenendo i gomiti vicini al corpo, e contrai la schiena in alto per un secondo.","Abbassa lentamente il peso inspirando.","Ripeti per il numero di ripetizioni previsto."],"Mantieni la schiena piatta e il busto fermo per evitare di scaricare lo sforzo sulla zona lombare."],["Smith_Machine_Calf_Raise","Calf raise al multipower","Polpacci","Macchina",1.5,["Metti un rialzo sotto il bilanciere del multipower, regola l'altezza in base alla tua statura e sali sul rialzo con l'avampiede, posizionando il bilanciere sulle spalle.","Afferra il bilanciere con entrambe le mani e sganciarlo ruotandolo: questa è la posizione di partenza.","Solleva i talloni il più possibile spingendo con l'avampiede, contraendo i polpacci, con le ginocchia estese ma non bloccate.","Torna lentamente alla posizione di partenza inspirando, abbassando i talloni.","Ripeti per il numero di ripetizioni previsto."],"Mantieni le ginocchia leggermente flesse e non bloccate durante tutto il movimento."],["Smith_Machine_Incline_Bench_Press","Panca inclinata (multipower)","Petto","Macchina",0.667,["Posiziona una panca inclinata sotto il multipower e regola il bilanciere a un'altezza raggiungibile da sdraiato.","Sdraiati sulla panca allineando il petto alto al bilanciere, afferralo con presa prona più larga delle spalle, sganciarlo e tienilo disteso sopra di te a braccia bloccate.","Inspirando, abbassa lentamente il bilanciere fino a sfiorare la parte alta del petto.","Dopo una breve pausa, spingi il bilanciere verso l'alto usando i pettorali, espirando.","Ripeti per il numero di ripetizioni previsto, poi riaggancia il bilanciere al rack."],"La discesa dovrebbe durare almeno il doppio della spinta, per mantenere il controllo del movimento."],["Smith_Machine_Overhead_Shoulder_Press","Lento avanti al multipower","Spalle","Macchina",0.667,["Posiziona una panca (meglio se con schienale) sotto il multipower e regola il bilanciere a un'altezza raggiungibile quasi a braccia tese da seduto.","Siediti leggermente dietro il bilanciere, afferralo con i palmi in avanti, sganciarlo e solleva le braccia completamente: questa è la posizione di partenza.","Abbassa lentamente il bilanciere fino al livello del mento, inspirando.","Spingi il bilanciere verso l'alto usando le spalle, espirando.","Ripeti per il numero di ripetizioni previsto."],"Tieni i piedi fermi e il busto stabile, senza inarcare la schiena durante la spinta."],["Smith_Machine_Squat","Squat al multipower","Quadricipiti","Macchina",0.667,["Imposta il bilanciere del multipower all'altezza adatta alla tua statura, posizionati sotto la barra e appoggiala sulla parte alta delle spalle, poco sotto il collo.","Afferra il bilanciere con entrambe le mani, sganciarlo spingendo con le gambe e raddrizzando il busto.","Metti i piedi larghezza spalle, punte leggermente verso l'esterno, testa alta e schiena dritta: questa è la posizione di partenza.","Scendi lentamente piegando le ginocchia, mantenendo il busto dritto e la testa alta, finché le cosce non sono leggermente sotto il parallelo, inspirando.","Risali spingendo con i talloni ed estendendo le gambe, espirando, fino a tornare alla posizione di partenza.","Ripeti per il numero di ripetizioni previsto."],"Le ginocchia non devono superare la punta dei piedi in avanti, per non caricare eccessivamente l'articolazione."],["Spider_Curl","Spider curl","Bicipiti","Bilanciere EZ",0.667,["Posiziona il bilanciere sulla panca Scott e sistemati sul lato anteriore, inclinato a circa 45 gradi con torso e addome appoggiati contro il cuscinetto.","Appoggia bene i piedi a terra e posiziona la parte superiore delle braccia sopra il cuscinetto interno della panca.","Afferra il bilanciere con presa supina, larghezza spalle o leggermente più stretta: questa è la posizione di partenza.","Solleva lentamente il bilanciere espirando, contraendo i bicipiti per un secondo in cima al movimento.","Torna lentamente alla posizione di partenza inspirando.","Ripeti per il numero di ripetizioni previsto."],"Mantieni le braccia appoggiate al cuscinetto per isolare il bicipite senza aiuto dello slancio."],["Split_Squat_with_Dumbbells","Split squat con manubri (bulgaro)","Quadricipiti","Manubri",1.5,["Mettiti in stazione sfalsata, con il piede posteriore rialzato e quello anteriore in avanti.","Tieni un manubrio in ogni mano lungo i fianchi: questa è la posizione di partenza.","Scendi piegando ginocchio e anca, mantenendo una buona postura e il ginocchio anteriore allineato al piede.","In fondo al movimento, spingi con il tallone anteriore per estendere ginocchio e anca e tornare alla posizione di partenza."],"Mantieni il busto eretto e il ginocchio anteriore allineato al piede, senza farlo cadere verso l'interno."],["Standing_Biceps_Cable_Curl","Curl ai cavi","Bicipiti","Cavi",0.667,["In piedi con il busto eretto, afferra la barra del cavo basso larghezza spalle, gomiti vicini al busto, presa supina.","Con la parte superiore delle braccia ferma, esegui il curl contraendo i bicipiti mentre espiri, muovendo solo gli avambracci.","Sali fino alla completa contrazione, con la barra all'altezza delle spalle, e tieni la posizione per un secondo.","Torna lentamente alla posizione di partenza inspirando.","Ripeti per il numero di ripetizioni previsto."],"Tieni i gomiti fissi lungo i fianchi: solo gli avambracci devono muoversi."],["Standing_Cable_Wood_Chop","Wood chop ai cavi","Addome","Cavi",1.5,["Collega una maniglia standard alla torre e porta la carrucola nella posizione più alta.","Mettiti di fianco al cavo, afferra la maniglia con una mano e allontanati fino ad avere il braccio teso e il cavo in tensione, poi afferra la maniglia anche con l'altra mano.","Con i piedi larghezza spalle e le braccia distese sopra la testa, tira la maniglia in un unico movimento verso il basso e attraverso il corpo fino al ginocchio anteriore, ruotando il busto.","Mantieni schiena e braccia dritte e il core contratto mentre ruoti il piede posteriore e pieghi le ginocchia per completare il movimento.","Torna lentamente e in modo controllato alla posizione neutra, mantenendo le braccia tese.","Ripeti fino a esaurimento, poi cambia lato ed esegui la stessa sequenza."],"Ruota tutto il busto in modo controllato, senza inarcare la schiena durante la torsione."],["Standing_Calf_Raises","Calf raise in piedi (macchina)","Polpacci","Macchina",0.667,["Regola la leva imbottita della macchina calf in base alla tua statura.","Metti le spalle sotto i cuscinetti, punte dei piedi in avanti, avampiede sul blocco e talloni fuori dal bordo. Spingi la leva verso l'alto estendendo anche e ginocchia fino a stare eretto: questa è la posizione di partenza.","Solleva i talloni espirando, estendendo le caviglie al massimo e contraendo i polpacci, tenendo le ginocchia ferme e non bloccate.","Torna lentamente alla posizione di partenza inspirando, abbassando i talloni fino a sentire l'allungamento del polpaccio.","Ripeti per il numero di ripetizioni previsto."],"Mantieni le ginocchia leggermente flesse e ferme per tutto il movimento, senza piegarle durante la salita."],["Standing_Dumbbell_Calf_Raise","Calf raise con manubri","Polpacci","Manubri",0.667,["In piedi con busto eretto, tieni un manubrio in ogni mano e metti l'avampiede su un rialzo stabile, con i talloni fuori e a contatto con il pavimento: questa è la posizione di partenza.","Solleva i talloni espirando, contraendo i polpacci, con le punte dei piedi nella direzione scelta.","Tieni la contrazione in alto per un secondo.","Torna lentamente alla posizione di partenza inspirando, abbassando i talloni.","Ripeti per il numero di ripetizioni previsto."],"Usa un rialzo stabile e sicuro per evitare di perdere l'equilibrio durante il movimento."],["Standing_Dumbbell_Press","Lento con manubri in piedi","Spalle","Manubri",0.667,["In piedi con i piedi larghezza spalle, tieni un manubrio per mano all'altezza della testa, gomiti larghi a circa 90 gradi: questa è la posizione di partenza.","Senza usare slancio delle gambe o inclinare il busto all'indietro, estendi i gomiti per sollevare i pesi sopra la testa.","Fai una pausa, poi torna lentamente alla posizione di partenza."],"Mantieni una tecnica rigorosa, senza spingere con le gambe o inarcare la schiena per aiutare la spinta."],["Standing_Dumbbell_Triceps_Extension","Estensioni tricipiti sopra la testa (manubrio)","Tricipiti","Manubri",0.667,["In piedi con i piedi larghezza spalle, afferra un manubrio con entrambe le mani e sollevalo sopra la testa a braccia tese.","Tieni il peso nei palmi con i pollici attorno al manico, palmi rivolti verso l'alto: questa è la posizione di partenza.","Con la parte superiore delle braccia vicina alla testa e ferma, abbassa il peso dietro la nuca finché gli avambracci toccano i bicipiti, inspirando.","Usa i tricipiti per tornare alla posizione di partenza, espirando.","Ripeti per il numero di ripetizioni previsto."],"Muovi solo gli avambracci: la parte superiore delle braccia resta ferma vicino alla testa."],["Standing_Dumbbell_Upright_Row","Tirate al mento con manubri","Trapezi","Manubri",0.667,["Afferra un manubrio per mano con presa prona, poco più stretta delle spalle, manubri appoggiati sulle cosce, braccia distese e schiena dritta: questa è la posizione di partenza.","Solleva i manubri usando le spalle, espirando, tenendoli vicini al corpo e guidando il movimento con i gomiti, fino quasi a toccare il mento.","Abbassa lentamente i manubri alla posizione di partenza, inspirando.","Ripeti per il numero di ripetizioni previsto."],"Durante la salita i gomiti devono restare sempre più alti degli avambracci, e il busto fermo."],["Standing_Leg_Curl","Leg curl in piedi","Femorali","Macchina",0.667,["Regola la leva della macchina in base alla tua statura e inclina il busto in avanti di 30-45 gradi, con il cuscinetto dietro la gamba destra, appena sotto il polpaccio.","Con il busto inclinato in avanti, distendi completamente la gamba e afferra le maniglie laterali: questa è la posizione di partenza.","Espirando, piega la gamba destra il più possibile senza sollevare la coscia dal cuscinetto, tenendo la contrazione per un secondo.","Inspirando, torna alla posizione di partenza. Ripeti per il numero di ripetizioni previsto.","Esegui lo stesso esercizio con la gamba sinistra."],"Tieni ferma la coscia sul cuscinetto: il movimento deve venire solo dal ginocchio."],["Standing_Low-Pulley_Deltoid_Raise","Alzata laterale al cavo basso","Spalle","Cavi",0.667,["Mettiti sul lato destro di un cavo basso, porta la mano sinistra dall'altro lato del corpo e afferra la maniglia singola con presa prona, appoggiando la mano destra alla macchina per equilibrio.","Tieni la schiena eretta e i piedi larghezza spalle: questa è la posizione di partenza.","Con il braccio sinistro, porta la maniglia lontano dal corpo fino all'altezza della spalla, espirando.","Tieni la contrazione per un secondo, poi torna lentamente alla posizione di partenza inspirando.","Ripeti per il numero di ripetizioni previsto.","Cambia braccio e ripeti l'esercizio."],"Mantieni un leggero piegamento del gomito per proteggere l'articolazione durante il movimento."],["Standing_Military_Press","Lento avanti in piedi (military press)","Spalle","Bilanciere",0.667,["Posiziona un bilanciere all'altezza del petto su un rack, afferralo con presa prona più larga delle spalle.","Piega leggermente le ginocchia, appoggia il bilanciere sulla clavicola, solleva il peso e fai un passo indietro con i piedi larghezza spalle.","Solleva il bilanciere sopra la testa bloccando le braccia, tenendolo leggermente davanti alla testa: questa è la posizione di partenza.","Abbassa lentamente il bilanciere fino alla clavicola, inspirando.","Spingi il bilanciere verso l'alto fino alla posizione di partenza, espirando.","Ripeti per il numero di ripetizioni previsto."],"Afferra il bilanciere ben più largo delle spalle e mantieni i piedi stabili per tutto il movimento."],["Stiff-Legged_Barbell_Deadlift","Stacco a gambe tese (bilanciere)","Femorali","Bilanciere",0.667,["Afferra un bilanciere con presa prona; usa dei polsini se il carico è elevato.","In piedi con busto dritto e gambe larghezza spalle o più strette, ginocchia leggermente piegate: questa è la posizione di partenza.","Tenendo le ginocchia ferme, abbassa il bilanciere sopra i piedi piegandoti dai fianchi e mantenendo la schiena dritta, finché non senti lo stiramento dei femorali, inspirando.","Risali raddrizzando il busto ed estendendo i fianchi fino alla posizione di partenza, espirando.","Ripeti per il numero di ripetizioni previsto."],"Mantieni le ginocchia quasi ferme e la schiena sempre dritta per proteggere la zona lombare."],["Stiff-Legged_Dumbbell_Deadlift","Stacco a gambe tese (manubri)","Femorali","Manubri",0.667,["Afferra un manubrio per mano, tenendoli lungo i fianchi a braccia tese.","In piedi con busto dritto e gambe larghezza spalle o più strette, ginocchia leggermente piegate: questa è la posizione di partenza.","Tenendo le ginocchia ferme, abbassa i manubri sopra i piedi piegandoti in avanti dal bacino e mantenendo la schiena dritta, finché non senti lo stiramento dei femorali, espirando.","Risali raddrizzando il busto ed estendendo i fianchi fino alla posizione di partenza, inspirando.","Ripeti per il numero di ripetizioni previsto."],"Mantieni la schiena dritta per tutto il movimento, senza inarcarla, per proteggere la zona lombare."],["Straight-Arm_Dumbbell_Pullover","Pullover con manubrio","Petto","Manubri",0.667,["Metti un manubrio in verticale su una panca piana.","Sdraiati perpendicolare alla panca, con solo le spalle appoggiate, fianchi sotto il bordo, ginocchia piegate e piedi a terra.","Afferra il manubrio con entrambe le mani e tienilo teso sopra il petto: questa è la posizione di partenza.","Con le braccia distese, abbassa lentamente il peso in un arco dietro la testa, inspirando, finché non senti lo stiramento del petto.","Riporta il manubrio alla posizione di partenza seguendo lo stesso arco, espirando.","Fai una pausa nella posizione iniziale e ripeti per il numero di ripetizioni previsto."],"Assicurati che il manubrio sia ben fissato prima di iniziare, per evitare che si sganci durante il movimento."],["Straight-Arm_Pulldown","Pulldown a braccia tese","Dorsali","Cavi",0.667,["Afferra la barra larga del cavo alto con presa prona più larga delle spalle e fai due passi indietro.","Inclina il busto in avanti di circa 30 gradi con le braccia distese davanti a te e un leggero piegamento dei gomiti, contraendo i dorsali.","Tenendo le braccia distese, tira la barra verso il basso contraendo i dorsali finché le mani non sono vicine ai fianchi, espirando.","Tenendo le braccia distese, torna alla posizione di partenza inspirando.","Ripeti per il numero di ripetizioni previsto."],"Mantieni sempre le braccia tese: il movimento deve arrivare dai dorsali, non dai gomiti."],["Sumo_Deadlift","Stacco sumo","Femorali","Bilanciere",0.667,["Posiziona il bilanciere a terra all'altezza del centro dei piedi, con i piedi molto larghi, vicino ai dischi.","Piegati dai fianchi per afferrare il bilanciere, braccia direttamente sotto le spalle e dentro le gambe, con presa prona, mista o a uncino.","Fai un respiro, abbassa i fianchi guardando avanti con petto alto, poi spingi attraverso il pavimento allargando i piedi ed estendendo anche e ginocchia.","Quando il bilanciere supera le ginocchia, inclinati leggermente indietro spingendo i fianchi in avanti e stringendo le scapole.","Riporta il peso a terra piegandoti dai fianchi e controllando la discesa."],"Mantieni il petto alto e la schiena dritta durante tutto il movimento, senza inarcarla o incurvarla."],["Svend_Press","Svend press","Petto","Altro",1.5,["Parti in posizione eretta.","Premi due dischi leggeri tra le mani, tenendoli vicino al petto per creare una contrazione isometrica nei pettorali: questa è la posizione di partenza.","Stringi i dischi tra i palmi ed estendi le braccia direttamente davanti a te in modo controllato.","Fai una pausa in fondo al movimento, poi torna lentamente alla posizione di partenza."],"Mantieni una pressione costante tra i palmi per tutto il movimento, per tenere i pettorali sempre contratti."],["T-Bar_Row_with_Handle","Rematore T-bar","Dorso","Bilanciere",1.5,["Posiziona un bilanciere in un landmine o in un angolo per bloccarlo e carica il peso desiderato.","Mettiti sopra il bilanciere, posiziona la maniglia a doppia impugnatura vicino al collare e alzati usando fianchi e gambe.","Assumi una stanza larga con i fianchi indietro e il petto alto, braccia distese: questa è la posizione di partenza.","Tira il peso verso l'addome alto retraendo le scapole e piegando i gomiti, senza slanci o compensazioni.","Dopo una breve pausa, torna alla posizione di partenza."],"Evita di dare strattoni al peso: il movimento deve essere controllato, guidato dalle scapole e dai gomiti."],["Tate_Press","Tate press","Tricipiti","Manubri",0.667,["Sdraiati su una panca piana con un manubrio per mano appoggiato sulle cosce, palmi rivolti l'uno verso l'altro.","Usando le cosce come aiuto, solleva i manubri uno alla volta fino a tenerli davanti a te larghezza spalle, con presa prona e gomiti verso l'esterno: questa è la posizione di partenza.","Con la parte superiore delle braccia ferma, abbassa i manubri lentamente in un arco verso il petto alto, inspirando, mantenendo il controllo totale.","Espirando, risali usando i tricipiti con lo stesso arco al contrario, tenendo i manubri vicini tra loro, e blocca le braccia in alto per un secondo.","Ripeti il movimento per il numero di ripetizioni previsto dal tuo programma."],"Mantieni la parte superiore delle braccia sempre ferma: il movimento deve arrivare solo dai tricipiti."],["Thigh_Abductor","Abductor machine","Abduttori","Macchina",0.667,["Siediti sulla macchina abductor e scegli un carico adeguato; con le gambe posizionate correttamente afferra le maniglie laterali: questa è la posizione di partenza.","Spingi lentamente le gambe verso l'esterno espirando.","Tieni la contrazione per un secondo, poi torna lentamente alla posizione di partenza inspirando.","Ripeti per il numero di ripetizioni previsto."],"Mantieni la parte superiore del corpo ferma durante tutto il movimento per evitare infortuni."],["Thigh_Adductor","Adductor machine","Adduttori","Macchina",0.667,["Siediti sulla macchina adductor e scegli un carico adeguato; con le gambe posizionate correttamente sui cuscinetti afferra le maniglie laterali: questa è la posizione di partenza.","Spingi lentamente le gambe l'una verso l'altra espirando.","Tieni la contrazione per un secondo, poi torna lentamente alla posizione di partenza inspirando.","Ripeti per il numero di ripetizioni previsto."],"Mantieni la parte superiore del corpo ferma ed evita movimenti bruschi per prevenire infortuni."],["Trap_Bar_Deadlift","Stacco con trap bar","Quadricipiti","Altro",1.5,["Carica la trap bar (o hex bar) con il peso adeguato e mettiti al centro dell'attrezzo, afferrando entrambe le maniglie.","Abbassa i fianchi, guarda avanti e tieni il petto alto.","Spingi attraverso i talloni ed estendi anche e ginocchia, senza mai incurvare la schiena.","A fine movimento, riporta il peso a terra in modo controllato."],"Mantieni la schiena dritta durante tutto il sollevamento, senza mai lasciarla incurvare."],["Tricep_Dumbbell_Kickback","Kickback tricipiti con manubrio","Tricipiti","Manubri",0.667,["Con un manubrio per mano, palmi verso il busto, schiena dritta e ginocchia leggermente piegate, piegati in avanti dai fianchi fino ad avere il busto quasi parallelo al pavimento, testa alta.","Tieni la parte superiore delle braccia vicina al busto e parallela al pavimento, avambracci verso il basso, con un angolo di 90 gradi al gomito: questa è la posizione di partenza.","Con la parte superiore delle braccia ferma, espira e usa i tricipiti per sollevare i pesi fino a braccia distese, muovendo solo l'avambraccio.","Dopo una breve pausa in contrazione, inspira e abbassa lentamente i manubri alla posizione di partenza.","Ripeti il movimento per il numero di ripetizioni previsto."],"Mantieni la parte superiore delle braccia ferma e parallela al pavimento: il movimento arriva solo dall'avambraccio."],["Triceps_Overhead_Extension_with_Rope","Estensioni sopra la testa con corda","Tricipiti","Cavi",0.667,["Collega una corda a un cavo basso, scegli il carico adeguato, afferra la corda con entrambe le mani e voltati con la schiena al cavo.","Posiziona le mani dietro la testa con i gomiti puntati verso l'alto: questa è la posizione di partenza.","Estendi i gomiti mantenendo la parte superiore delle braccia ferma, sollevando le mani sopra la testa.","Contrai i tricipiti in cima al movimento, poi abbassa lentamente il peso alla posizione di partenza."],"Tieni la parte superiore delle braccia immobile: il movimento deve arrivare solo dall'estensione del gomito."],["Triceps_Pushdown","Pushdown tricipiti ai cavi","Tricipiti","Cavi",0.667,["Collega una barra dritta o angolata al cavo alto e afferrala con presa prona, larghezza spalle.","In piedi con busto dritto e leggermente inclinato in avanti, tieni la parte superiore delle braccia vicina al corpo e perpendicolare al pavimento: questa è la posizione di partenza.","Usando i tricipiti, spingi la barra verso il basso finché non tocca le cosce e le braccia sono completamente distese, espirando.","Dopo una pausa di un secondo in contrazione, riporta lentamente la barra in alto inspirando.","Ripeti per il numero di ripetizioni previsto."],"Tieni la parte superiore delle braccia sempre ferma vicino al busto: solo gli avambracci devono muoversi."],["Triceps_Pushdown_-_Rope_Attachment","Pushdown tricipiti con corda","Tricipiti","Cavi",0.667,["Collega una corda al cavo alto e afferrala con presa neutra, palmi rivolti l'uno verso l'altro.","In piedi con busto dritto e leggermente inclinato in avanti, tieni la parte superiore delle braccia vicina al corpo e perpendicolare al pavimento: questa è la posizione di partenza.","Usando i tricipiti, spingi la corda verso il basso separando le estremità verso le cosce, finché le braccia non sono completamente distese, espirando.","Dopo una pausa di un secondo in contrazione, riporta lentamente la corda in alto inspirando.","Ripeti per il numero di ripetizioni previsto."],"Tieni la parte superiore delle braccia sempre ferma vicino al busto: solo gli avambracci devono muoversi."],["Triceps_Pushdown_-_V-Bar_Attachment","Pushdown tricipiti con barra a V","Tricipiti","Cavi",0.667,["Collega una barra a V al cavo alto e afferrala con presa prona, larghezza spalle.","In piedi con busto dritto e leggermente inclinato in avanti, tieni la parte superiore delle braccia vicina al corpo e perpendicolare al pavimento: questa è la posizione di partenza.","Usando i tricipiti, spingi la barra verso il basso finché non tocca le cosce e le braccia sono completamente distese, espirando.","Dopo una pausa di un secondo in contrazione, riporta lentamente la barra in alto inspirando.","Ripeti per il numero di ripetizioni previsto."],"Tieni la parte superiore delle braccia sempre ferma vicino al busto: solo gli avambracci devono muoversi."],["Underhand_Cable_Pulldowns","Lat machine presa supina","Dorsali","Cavi",0.667,["Siediti alla macchina lat con una barra larga sul cavo alto e regola il cuscinetto per le ginocchia in base alla tua statura.","Afferra la barra con presa supina, mani più strette della larghezza delle spalle.","Con le braccia distese davanti a te, inclina il busto indietro di circa 30 gradi, inarcando leggermente la zona lombare e sporgendo il petto: questa è la posizione di partenza.","Espirando, tira la barra verso il basso fino a toccare il petto alto, portando spalle e braccia indietro e in basso, mantenendo i gomiti vicini al corpo.","Dopo un secondo in contrazione, inspirando torna lentamente alla posizione di partenza a braccia distese.","Ripeti il movimento per il numero di ripetizioni previsto."],"Mantieni il busto superiore fermo: il movimento deve arrivare solo dalle braccia e dai dorsali."],["Upright_Barbell_Row","Tirate al mento con bilanciere","Spalle","Bilanciere",0.667,["Afferra un bilanciere con presa prona poco più stretta delle spalle, bilanciere appoggiato sulle cosce, braccia distese e schiena dritta: questa è la posizione di partenza.","Espira e solleva il bilanciere usando le spalle, alzando i gomiti verso l'esterno, tenendo la barra vicina al corpo fino quasi a toccare il mento.","Abbassa lentamente il bilanciere alla posizione di partenza, inspirando.","Ripeti per il numero di ripetizioni previsto."],"I gomiti devono guidare il movimento e restare sempre più alti degli avambracci."],["Upright_Cable_Row","Tirate al mento ai cavi","Trapezi","Cavi",0.667,["Afferra la barra dritta del cavo basso con presa prona poco più stretta delle spalle, barra appoggiata sulle cosce, braccia distese e schiena dritta: questa è la posizione di partenza.","Espira e solleva la barra usando le spalle, tenendola vicina al corpo fino quasi a toccare il mento.","Abbassa lentamente la barra alla posizione di partenza, inspirando.","Ripeti per il numero di ripetizioni previsto."],"I gomiti devono guidare il movimento e restare sempre più alti degli avambracci, con il busto fermo."],["V-Bar_Pulldown","Lat machine con triangolo","Dorsali","Cavi",0.667,["Siediti alla macchina lat con una barra a V sul cavo alto e regola il cuscinetto per le ginocchia in base alla tua statura.","Afferra la barra a V con presa neutra, sporgi il petto e inclinati leggermente indietro (circa 30 gradi): questa è la posizione di partenza.","Usando i dorsali, tira la barra verso il basso stringendo le scapole, finché il petto non è vicino alla barra, espirando.","Dopo un secondo in contrazione, torna lentamente alla posizione di partenza inspirando.","Ripeti per il numero di ripetizioni previsto."],"Mantieni il busto fermo per tutto il movimento: il lavoro deve venire dai dorsali, non dalla schiena bassa."],["Weighted_Pull_Ups","Trazioni zavorrate","Dorsali","Altro",1.5,["Fissa un peso a una cintura per dip e allacciala in vita. Afferra la sbarra con presa prona, larghezza spalle.","Inclina leggermente il busto indietro (circa 30 gradi), inarcando la zona lombare e sporgendo il petto: questa è la posizione di partenza.","Espira e tira il busto verso l'alto finché la testa non supera le mani, stringendo le scapole verso il basso.","Dopo una breve pausa in alto, inspira e abbassa lentamente il busto alla posizione di partenza, braccia distese e dorsali completamente allungati."],"Concentrati sulle scapole nella trazione: evita di dondolare o usare slancio per salire."],["Wide-Grip_Lat_Pulldown","Lat machine presa larga","Dorsali","Cavi",0.667,["Siediti alla macchina lat con una barra larga sul cavo alto e regola il cuscinetto per le ginocchia in base alla tua statura.","Afferra la barra con presa prona più larga delle spalle.","Con le braccia distese davanti a te, inclina il busto indietro di circa 30 gradi, inarcando leggermente la zona lombare e sporgendo il petto: questa è la posizione di partenza.","Espirando, tira la barra verso il basso fino a toccare il petto alto, portando spalle e braccia indietro e in basso.","Dopo un secondo in contrazione stringendo le scapole, inspirando torna lentamente alla posizione di partenza a braccia distese.","Ripeti il movimento per il numero di ripetizioni previsto."],"Non tirare la barra con gli avambracci: il movimento deve venire dalle spalle e dai dorsali, con il busto fermo."],["Zottman_Curl","Curl Zottman","Bicipiti","Manubri",0.667,["In piedi con busto eretto, tieni un manubrio per mano a braccia tese, gomiti vicini al busto e palmi rivolti l'uno verso l'altro: questa è la posizione di partenza.","Con la parte superiore del braccio ferma, esegui il curl contraendo i bicipiti ed espirando, ruotando il polso fino a presa supina, finché i manubri non sono all'altezza delle spalle; tieni la contrazione per un secondo.","In cima al movimento, ruota il polso fino a presa prona, con il pollice più in alto del mignolo.","Abbassa lentamente i manubri mantenendo la presa prona.","Quando i manubri sono vicini alle cosce, ruota di nuovo il polso tornando a una presa neutra e ripeti per il numero di ripetizioni previsto."],"La rotazione del polso è la chiave dell'esercizio: presa supina in salita e prona in discesa, per lavorare anche gli avambracci."]].map(([id,name,muscle,equip,aspect,steps,tips])=>({id,name,muscle,equip,aspect,steps,tips}));

// ================= NUTRITION MATH
// Energy needs: Mifflin-St Jeor BMR x activity level (daily life + training), goal adjustment as % of TDEE, safety floor.
const JOB={sedentario:["Seduto quasi tutto il giorno",0],leggero:["Movimento leggero (spostamenti a piedi, casa)",1],moderato:["In piedi quasi tutto il giorno",2],alto:["Lavoro fisico pesante",3]};
const PAL=[1.2,1.3,1.4,1.5,1.6,1.7,1.8];
function trainingPoints(p){const h=(num(p.days)||0)*(num(p.minutes)||0)/60;return {h:r1(h),pts:h<1?0:h<3?1:h<5?2:3}}
function targets(p=S.profile){
  const w=num(p.weight)||70,hm=(num(p.height)||170)/100,bmi=w/(hm*hm),low=bmi<18.5,bmr=bmrOf(p);
  const job=JOB[p.activity]||JOB.moderato,tr=trainingPoints(p),lvl=job[1]+tr.pts,pal=PAL[lvl];
  const tdee=bmr*pal;
  const pct={dimagrire:-0.20,recomp:-0.10,massa:0.10,mantenere:0}[p.goal]??0;
  const cap={dimagrire:500,recomp:250,massa:350,mantenere:0}[p.goal]??0;
  let goalAdj=Math.sign(pct)*Math.min(cap,Math.abs(tdee*pct));if(low)goalAdj=Math.max(0,goalAdj);
  const adj=low?Math.max(0,num(p.kcalAdj)||0):(num(p.kcalAdj)||0);
  const floor=kcalFloor(p),raw=tdee+goalAdj+adj,kcal=Math.max(floor,raw);
  // protein on reference weight (weight at BMI 25 if BMI>25, to avoid overestimating with excess fat)
  const refW=bmi>25?25*hm*hm:w,pk={dimagrire:2.2,recomp:2.0,massa:1.8,mantenere:1.6}[p.goal]??1.8;
  const prot=refW*pk;
  let fat=Math.max(0.8*refW,0.25*kcal/9);
  let carb=(kcal-prot*4-fat*9)/4;
  if(carb<2*refW){fat=Math.max(0.6*refW,0.20*kcal/9);carb=Math.max(0,(kcal-prot*4-fat*9)/4)}
  return {kcal:r0(kcal),p:r0(prot),c:r0(carb),f:r0(fat),bmr:r0(bmr),low,
    d:{w,hm,bmi:r1(bmi),job:job[0],jobPts:job[1],trainH:tr.h,trainPts:tr.pts,lvl,pal,tdee:r0(tdee),pct,goalAdj:r0(goalAdj),adj:r0(adj),floor,raw:r0(raw),floored:raw<floor,refW:r1(refW),pk}};
}

const STOP=new Set(["di","al","alla","con","e","in","la","il","lo","le","gli","del","della","allo","ai","da","per","g","gr","ml"]);
const toks=s=>norm(s).replace(/\(.*?\)/g,m=>" "+m.slice(1,-1)+" ").split(/[^a-z0-9]+/).filter(t=>t.length>1&&!STOP.has(t));
const FOODTOK=FOODS.map(f=>toks(f.name));
function searchFoods(q,n=20){
  const qt=toks(q);if(!qt.length)return [];
  const res=[];
  FOODS.forEach((f,i)=>{let s=0;const ft=FOODTOK[i];
    qt.forEach((t,k)=>{const hit=ft.some(x=>x===t)?1:ft.some(x=>x.startsWith(t.slice(0,Math.max(4,t.length-2)))||t.startsWith(x.slice(0,Math.max(4,x.length-2))))?.7:0;s+=hit*(k===0?1.5:1)});
    if(s<=0)return;
    if(ft[0]&&qt.some(t=>ft[0].startsWith(t.slice(0,4))))s+=.6;
    if(!qt.some(t=>/cott|bollit|grigliat|forno/.test(t))&&/crud/.test(norm(f.name)))s+=.25;
    s-=ft.length*.04;res.push([s,f])});
  return res.sort((a,b)=>b[0]-a[0]).slice(0,n).map(x=>x[1]);
}
const SYN={"insalata":"Lattuga (cruda)","insalata mista":"Lattuga (cruda)","olio":"Olio extravergine di oliva","olio evo":"Olio extravergine di oliva","olio d'oliva":"Olio extravergine di oliva","olio di oliva":"Olio extravergine di oliva","olio extra vergine":"Olio extravergine di oliva","uova":"Uovo intero (crudo)","uovo":"Uovo intero (crudo)","pane":"Pane comune (tipo italiano)","grana":"Parmigiano/Grana","grana padano":"Parmigiano/Grana","parmigiano reggiano":"Parmigiano/Grana","frutti di bosco":"Mirtilli","skyr":"Yogurt greco 0% bianco","philadelphia":"Formaggio fresco spalmabile","formaggio spalmabile":"Formaggio fresco spalmabile","songino":"Valeriana/songino (cruda)","caffe":"Caffè espresso","riso basmati":"Riso bianco (crudo)","latte di mandorla":"Bevanda di mandorla non zuccherata","latte di soia":"Bevanda di soia","latte di riso":"Bevanda di riso","pizza":null,"gnocchi":null,"fette biscottate":null,"piadina":null,"grissini":null,"riso jasmine":"Riso bianco (crudo)"};
const DESCR=new Set(["fresco","fresca","freschi","fresche","basmati","bio","light","extra","italiano","italiana","nostrano","misto","mista","naturale","bianco","bianca"]);
function matchFood(name){
  if(!name)return null;const ex=FOODBY[String(name).toLowerCase()];if(ex)return ex;
  const key=norm(name).replace(/\s+/g," ").trim(),syn=SYN[key];if(syn===null)return null;if(syn&&FOODBY[syn.toLowerCase()])return FOODBY[syn.toLowerCase()];
  const qt=toks(name);if(!qt.length)return null;
  const cooked=qt.some(t=>/^cott|bollit|grigliat|arrost|forno/.test(t)),raw=qt.some(t=>/^crud/.test(t));
  for(const r of searchFoods(name,6)){
    const ft=toks(r.name),nm=norm(r.name);
    if(raw&&/cott|arrost|forno|fritt/.test(nm))continue;
    if(cooked&&/crud/.test(nm))continue;
    if(!ft.slice(0,2).some(x=>x.startsWith(qt[0].slice(0,4))||qt[0].startsWith(x.slice(0,4))))continue;
    const pm=t=>ft.some(x=>x===t||x.startsWith(t.slice(0,Math.max(4,t.length-2)))||t.startsWith(x.slice(0,Math.max(4,x.length-2))));
    if(qt.filter(t=>t.length>=4&&!DESCR.has(t)&&!/^(crud|cott)/.test(t)).every(pm))return r;
  }
  return null;
}
function gramsOf(f){const u=norm(f.unit||"");const q=num(f.qty);if(!q)return 0;if(!u||u==="g"||u==="gr"||u==="ml")return q;if(u==="kg"||u==="l")return q*1000;
  if(/pz|pezz|n|unit|fett|vasett|cucchiai|cucch|tazz/.test(u)){if(/cucchiaino/.test(u))return q*5;if(/cucchiai/.test(u))return q*(/olio/.test(norm(f.name))?10:15);if(/tazz/.test(u))return q*200;const n=norm(f.name+" "+u);const p=PIECE.find(([re])=>re.test(n));return p?q*p[1]:0}return 0}
function foodNut(f){const db=matchFood(f.db||f.name);const g=gramsOf(f);if(!db||!g)return null;const k=g/100;return {kcal:db.kcal*k,p:db.p*k,c:db.c*k,f:db.f*k,db:db.name}}
function foodsTotals(foods){const t={kcal:0,p:0,c:0,f:0,miss:[]};(foods||[]).forEach(f=>{const n=foodNut(f);if(n){t.kcal+=n.kcal;t.p+=n.p;t.c+=n.c;t.f+=n.f}else t.miss.push(f.name)});return t}
function optionTotals(o){const t=foodsTotals(o.foods);if((!o.foods||!o.foods.length||t.miss.length===o.foods.length)&&o.kcal!=null)return {kcal:num(o.kcal),p:num(o.p),c:num(o.c),f:num(o.f),miss:[],est:true};return t}

  const low=lo&&hi?lo:0,topSet=ws.filter(s=>num(s.kg)===best),rirs=topSet.map(s=>s.rir).filter(x=>x!=null&&x!=="");
  if(best>0&&rirs.length&&rirs.every(x=>+x>=4)&&topSet.every(s=>num(s.reps)>=(low||1)))return {kg:best+inc,txt:`Ultima volta ti restavano 4 o più ripetizioni: era facile, prova ${best+inc} kg${db?" (per manubrio)":""}.`};

function calendar(){
  const t=today(),first=t.slice(0,8)+"01",start=mondayOf(first),days=new Set(S.training.workouts.map(w=>w.date));
  let h=`<div class="cal">${["L","M","M","G","V","S","D"].map(d=>`<div class="tiny muted">${d}</div>`).join("")}`;
  for(let d=start,i=0;i<42;i++,d=addDays(d,1)){if(i>=35&&monthOf(d)!==monthOf(t))break;h+=`<div class="cd ${monthOf(d)!==monthOf(t)?"out":""} ${days.has(d)?"on":""} ${d===t?"now":""}">${+d.slice(8)}</div>`}
  return h+`</div><p class="tiny muted" style="margin-top:8px">${S.training.workouts.filter(w=>monthOf(w.date)===monthOf(t)).length} allenamenti questo mese</p>`;
}
function spark(v,w=60,h=18){if(v.length<2)return "";const mn=Math.min(...v),mx=Math.max(...v);const pts=v.map((x,i)=>`${r1(i/(v.length-1)*w)},${r1(h-(mx===mn?h/2:(x-mn)/(mx-mn)*h))}`).join(" ");return ` <svg width="${w}" height="${h}" style="vertical-align:middle;margin-left:6px;overflow:visible"><polyline points="${pts}" fill="none" stroke="var(--brand)" stroke-width="2"/></svg>`}
function libItems(){return EX.filter(e=>(!libM||e.muscle===libM)&&(!libQ||norm(e.name).includes(norm(libQ))))}
function exRow(e,act){return `<div class="exrow" data-act="${act}" data-id="${esc(e.id)}">${exThumb(e.id)}<div style="flex:1;min-width:0"><b class="small">${esc(e.name)}</b><div class="tiny muted">${esc(e.muscle)} · ${esc(e.equip)}${blockedBy(e.id)?` · <span style="color:var(--warn)">⚠ ${esc(blockedBy(e.id))}</span>`:""}</div></div><span class="muted">›</span></div>`}

    if(pickReplace!=null){const old=active.ex[pickReplace];item.sets=old.sets.map((s,i)=>({...s,kg:lp?.sets[i]?.kg??"",done:false,prev:lp&&lp.sets[i]?`${lp.sets[i].kg}×${lp.sets[i].reps}`:"—"}));item.reps=old.reps;item.rest=old.rest;item.ss=old.ss;active.ex[pickReplace]=item}

// ---------- active workout
function startWorkout(r){
  const dl=deloadActive();
  active={id:uid(),name:r?r.name:"Allenamento libero",routineId:r?.id||null,start:Date.now(),date:today(),notes:"",deload:dl,ex:(r?r.ex:[]).map(e=>{const sg=suggestion(e),lp=lastPerf(e.id);
    const n=dl?Math.max(1,Math.round((+e.sets||3)*0.6)):(+e.sets||3),kg0=sg?sg.kg:(e.kg||""),kg=dl&&num(kg0)?roundTo(num(kg0)*0.9,stepFor(e.id)):kg0;
    return {id:e.id,name:e.name,reps:e.reps,rest:+e.rest||90,rir:e.rir||"",note:e.note||"",ss:e.ss||null,hint:dl?"Settimana di scarico: meno serie e circa il 10% di peso in meno.":(sg?.txt||""),sets:Array.from({length:n},(_,i)=>({kg,reps:"",t:"n",done:false,prev:lp&&lp.sets[i]?`${lp.sets[i].kg}×${lp.sets[i].reps}`:"—"}))}})};
  persistActive();openActive();
}
function editWorkout(w){
  if(active){toast("Termina prima l'allenamento in corso");return}
  active={...JSON.parse(JSON.stringify(w)),editId:w.id,start:w.start||Date.now()-((w.dur||0)*60000)};
  active.ex.forEach(e=>{e.reps=e.reps||"8-12";e.rest=e.rest||90;e.sets.forEach(s=>{s.t=s.t||"n";s.prev="—"})});

  const prs=editing?[]:ex.filter(e=>{const ws=workSets(e);if(!ws.length)return false;const best=Math.max(...ws.map(s=>e1rm(s.kg,s.reps)));const prev=others.flatMap(x=>x.ex.filter(y=>y.id===e.id)).flatMap(workSets).map(s=>e1rm(num(s.kg),num(s.reps)));return prev.length&&best>Math.max(...prev)}).map(e=>e.name);
  if(editing){const old=S.training.workouts.find(x=>x.id===editing);if(old)markW(old.date)}
  S.training.workouts=[w,...others];sortWorkouts();markW(w.date);
  const r=S.training.routines.find(x=>x.id===w.routineId);
  if(r&&!editing)r.ex.forEach(re=>{const d=ex.find(e=>e.id===re.id);if(d){const ws=workSets(d);if(ws.length)re.kg=Math.max(...ws.map(s=>s.kg))}});
  save("training");
  active=null;rest=null;persistActive();closeModal("workoutModal");
  if(editing){toast("Allenamento aggiornato");render();return}
  showModal("summaryModal",()=>`<div style="text-align:center"><div class="big" style="color:var(--success)">Ottimo lavoro!</div><p class="muted">${esc(w.name)}</p>
    <div class="row" style="justify-content:center;gap:28px;margin:18px 0"><div class="stat"><b>${w.dur} min</b><span>durata</span></div><div class="stat"><b>${r0(w.vol)} kg</b><span>volume</span></div><div class="stat"><b>${ex.reduce((a,e)=>a+e.sets.length,0)}</b><span>serie</span></div></div>
    ${prs.length?`<div class="hint small">🏆 Nuovi record: ${prs.map(esc).join(", ")}</div>`:""}
    <button class="btn primary" style="margin-top:16px" data-act="close">Chiudi</button></div>`);
}

function normPlan(r,source){
  return {name:r.name||"Piano alimentare",notes:r.notes||"",source,dayTargets:r.dayTargets&&typeof r.dayTargets==="object"?Object.fromEntries(Object.entries(r.dayTargets).map(([k,v])=>[k,r0(num(v))]).filter(([k,v])=>v>0)):null,days:(r.days||[]).map(d=>({day:d.day||"Tutti i giorni",training:!!d.training,meals:(d.meals||[]).map(m=>({type:MEALNAME[m.type]?m.type:"pranzo",options:(m.options||[]).map(o=>({name:o.name||"",foods:(o.foods||[]).map(f=>({name:f.name,db:f.db&&FOODBY[String(f.db).toLowerCase()]?FOODBY[String(f.db).toLowerCase()].name:null,qty:num(f.qty)||"",unit:f.unit||"",alt:f.alt||""})),kcal:o.kcal??null,p:o.p??null,c:o.c??null,f:o.f??null}))})).sort((a,b)=>MEALS.findIndex(z=>z[0]===a.type)-MEALS.findIndex(z=>z[0]===b.type))}))};

// deterministic fit: scale gram quantities so each day hits its calorie target
// keep protein sources fixed, scale carb/fat sources so a day hits its calorie target
const isProtFood=f=>{const d=matchFood(f.db||f.name);return d&&d.kcal>0&&d.p*4/d.kcal>=.4};
function fitDay(primary,all,tg){ // primary: options counted in the day total; all: every option to scale
  for(let it=0;it<4;it++){
    let prot=0,other=0;
    primary.forEach(o=>{if(!o)return;const t=optionTotals(o);if(t.est){prot+=t.kcal;return}(o.foods||[]).forEach(f=>{const n=foodNut(f);if(!n)return;const u=norm(f.unit);if(isProtFood(f)||!(!u||u==="g"||u==="ml"))prot+=n.kcal;else other+=n.kcal})});
    if(!other)return;const k=Math.max(.4,Math.min(2,(tg-prot)/other));if(Math.abs(k-1)<.03)return;
    all.forEach(o=>(o.foods||[]).forEach(f=>{const u=norm(f.unit);if(num(f.qty)&&(!u||u==="g"||u==="ml")&&!isProtFood(f)){const q=num(f.qty)*k;f.qty=q<20?Math.max(1,Math.round(q)):Math.round(q/5)*5}}));
    all.forEach(o=>{if(o.foods?.length){o.kcal=null;o.p=null;o.c=null;o.f=null}});
  }
}

}

function parseShop(t){const m=t.trim().match(/^(\d+[.,]?\d*)\s*(g|kg|ml|l|pz|x)?\s+(.+)$/i);if(m){let q=num(m[1]),u=(m[2]||"pz").toLowerCase();if(u==="kg"){q*=1000;u="g"}if(u==="l"){q*=1000;u="ml"}if(u==="x")u="pz";return {name:m[3].trim(),qty:q,unit:u}}return {name:t.trim(),qty:"",unit:""}}

// ================= SAFETY LIMITS (fixed rules the AI cannot override)
const SAFE={minKcalM:1500,minKcalF:1200,protMin:1.4,protMax:2.5,fatMin:0.6,maxAdj:600,
  weeklySets:{principiante:12,intermedio:18,avanzato:22},maxSetsPerEx:{principiante:4,intermedio:5,avanzato:6},maxExPerSession:8,
  rate:{dimagrire:[-1.0,-0.4],recomp:[-0.4,0.15],massa:[0.1,0.5],mantenere:[-0.3,0.3]}};
function bmrOf(p=S.profile){const w=num(p.weight)||70,h=num(p.height)||170,a=num(p.age)||30;return 10*w+6.25*h-5*a+(p.sex==="F"?-161:5)}
function profileError(p=S.profile){const a=num(p.age),h=num(p.height),w=num(p.weight);
  if(a&&a<18)return "Equilibra è pensata per gli adulti (dai 18 anni): calorie e programmi per chi è più giovane vanno decisi con un medico o un allenatore.";
  if(a&&a>100)return "Controlla l'età";if(h&&(h<120||h>230))return "Controlla l'altezza (in centimetri)";if(w&&(w<30||w>300))return "Controlla il peso (in kg)";return ""}
function kcalFloor(p=S.profile){return r0(Math.max(bmrOf(p),p.sex==="F"?SAFE.minKcalF:SAFE.minKcalM))}
function planSafety(plan){
  const w=targets().d.refW||num(S.profile.weight)||70,floor=kcalFloor(),out=[];
  (plan?.days||[]).forEach(d=>{const t=dayPlanTotals(d);if(!t.kcal)return;
    if(t.kcal<floor-20)out.push(`${d.day}: ${r0(t.kcal)} kcal, sotto il minimo di sicurezza (${floor})`);
    if(t.p/w>SAFE.protMax)out.push(`${d.day}: proteine ${r1(t.p/w)} g/kg, sopra ${SAFE.protMax}`);
    else if(t.p/w<SAFE.protMin)out.push(`${d.day}: proteine ${r1(t.p/w)} g/kg, sotto ${SAFE.protMin}`);
    if(t.f/w<SAFE.fatMin)out.push(`${d.day}: grassi ${r1(t.f/w)} g/kg, sotto ${SAFE.fatMin}`)});
  return out;
}
function repsRange(r){if(/\d\s*(s|sec|secondi)\b/i.test(String(r||"")))return String(r).trim();const m=String(r||"").match(/(\d+)\s*[-–]\s*(\d+)/),one=String(r||"").match(/\d+/);let lo=m?+m[1]:one?+one[0]:8,hi=m?+m[2]:lo;lo=Math.min(30,Math.max(3,lo));hi=Math.min(30,Math.max(lo,hi));return lo===hi?String(lo):`${lo}-${hi}`}
function sanitizeRoutines(routines,level=effLevel(),minutes=num(S.profile.minutes)||60){
  const notes=[],cap=SAFE.weeklySets[level]||18,setCap=SAFE.maxSetsPerEx[level]||5,sessCap=Math.max(9,Math.round(minutes/3));
  const mus=e=>EXBY[e.id]?.muscle||"Altro";
  // trim sets of a list of exercises from the end: first down to 2 sets each, then drop whole exercises
  function trim(list,over,remove){
    for(let pass=0;pass<20&&over>0;pass++){let did=false;for(let i=list.length-1;i>=0&&over>0;i--){if(list[i].sets>2){list[i].sets--;over--;did=true}}if(!did)break}
    for(let i=list.length-1;i>=0&&over>0;i--){if(remove(list[i])){over-=list[i].sets;list[i].sets=0}}
    return over;
  }
  let clamped=0,cut=0;
  routines.forEach(r=>{
    if(r.ex.length>SAFE.maxExPerSession){cut+=r.ex.length-SAFE.maxExPerSession;r.ex=r.ex.slice(0,SAFE.maxExPerSession)}
    r.ex.forEach(e=>{const s=Math.round(num(e.sets)||3),c=Math.min(setCap,Math.max(1,s));if(c!==s)clamped++;e.sets=c;e.reps=repsRange(e.reps);e.rest=Math.min(300,Math.max(30,num(e.rest)||90))});
    const tot=r.ex.reduce((a,e)=>a+e.sets,0);
    if(tot>sessCap){trim(r.ex,tot-sessCap,e=>r.ex.filter(x=>x.sets>0).length>3);r.ex=r.ex.filter(e=>e.sets>0);notes.push(`${r.name}: ridotta a ${r.ex.reduce((a,e)=>a+e.sets,0)} serie per stare in ${minutes} minuti`)}
  });
  if(cut)notes.push(`massimo ${SAFE.maxExPerSession} esercizi per seduta`);
  if(clamped)notes.push(`serie per esercizio limitate a ${setCap} (${clamped} esercizi)`);
  const per={};routines.forEach(r=>r.ex.forEach(e=>{per[mus(e)]=(per[mus(e)]||0)+e.sets}));
  Object.entries(per).forEach(([m,n])=>{if(n<=cap)return;
    const list=routines.flatMap(r=>r.ex.filter(e=>mus(e)===m).map(e=>Object.assign(e,{_r:r})));
    trim(list,n-cap,e=>e._r.ex.filter(x=>x.sets>0).length>2);
    routines.forEach(r=>{r.ex=r.ex.filter(e=>e.sets>0)});
    const after=routines.reduce((a,r)=>a+r.ex.filter(e=>mus(e)===m).reduce((b,e)=>b+e.sets,0),0);
    notes.push(`${m}: da ${n} a ${after} serie a settimana (limite ${cap} per il tuo livello)`)});
  routines.forEach(r=>r.ex.forEach(e=>delete e._r));
  return notes;
}
function weeklyVolume(routines){const per={};routines.forEach(r=>r.ex.forEach(e=>{const m=EXBY[e.id]?.muscle||"Altro";per[m]=(per[m]||0)+(num(e.sets)||0)}));return per}

// ================= WEEKLY CHECK-IN (rules, not guesses)
function weightAvg(from,to){const w=S.profile.weights.filter(x=>x.d>=from&&x.d<=to);return w.length?w.reduce((a,x)=>a+num(x.kg),0)/w.length:null}
function checkinDue(){const c=S.profile.checkins||[],last=c[c.length-1];return !last||addDays(last.date,7)<=today()}

  const ids=[...new Set(S.training.routines.flatMap(r=>r.ex.map(e=>e.id)))];
  return ids.map(id=>{const h=exHistory(id);if(h.length<4)return null;const l=h.slice(-4);return Math.max(l[1].e1,l[2].e1,l[3].e1)<=l[0].e1*1.005?{id,name:EXBY[id]?.name||(S.training.routines.flatMap(r=>r.ex).find(e=>e.id===id)||{}).name}:null}).filter(Boolean);
}
function runCheckin(){
  const t=today(),p=S.profile,cur=weightAvg(addDays(t,-6),t),prev=weightAvg(addDays(t,-13),addDays(t,-7));
  if(cur==null){toast("Registra prima il peso di oggi");return}
  const notes=[];let adj=0,pct=null;
  const base=targets().kcal,floor=kcalFloor();
  const logged=Array.from({length:7},(_,i)=>addDays(t,-i-1)).filter(d=>(S.nutrition.log[d]||[]).length>=2);
  const avgEaten=logged.length?logged.reduce((a,d)=>a+dayTotals(d).kcal,0)/logged.length:null;
  const adherence=logged.length>=4?avgEaten/base:null;
  if(prev==null)notes.push("Primo controllo: ho preso il punto di partenza. Non serve pesarti spesso: una volta a settimana, nelle stesse condizioni, basta. Conta la tendenza, non il singolo numero.");
  else{
    pct=(cur-prev)/prev*100;const [lo,hi]=SAFE.rate[p.goal]||SAFE.rate.mantenere;
    notes.push(`Tendenza: ${pct<-0.15?"in calo":pct>0.15?"in aumento":"stabile"}, ${pct<lo||pct>hi?"diversa da quella prevista per il tuo obiettivo":"in linea con il tuo obiettivo"}.`);
    if(adherence!=null&&Math.abs(adherence-1)>0.15)notes.push(`Nel diario hai mangiato in media ${r0(avgEaten)} kcal contro ${base}: prima di cambiare le calorie segui il piano per un'altra settimana.`);
    else if(pct<lo){adj=150;notes.push(p.goal==="dimagrire"?"Stai scendendo troppo in fretta: aggiungo 150 kcal per proteggere muscoli ed energia.":"Sei sotto l'andamento previsto: aggiungo 150 kcal al giorno.")}
    else if(pct>hi&&!targets().low){adj=-150;notes.push("Sei sopra l'andamento previsto: tolgo 150 kcal al giorno.")}
    else notes.push("Sei in linea: nessun cambiamento alle calorie.");
    if(adherence==null)notes.push("Suggerimento: registrare i pasti nel diario almeno 4 giorni rende il controllo più preciso.");
  }
  if(adj){const newAdj=Math.max(-SAFE.maxAdj,Math.min(SAFE.maxAdj,(num(p.kcalAdj)||0)+adj));
    let real=newAdj-(num(p.kcalAdj)||0);
    if(real<0&&base+real<floor){real=Math.min(0,floor-base);notes.push(`Sei già vicino al minimo di sicurezza (${floor} kcal): invece di mangiare meno, aumenta il movimento quotidiano (passi).`)}
    if(real===0&&adj>0&&newAdj===num(p.kcalAdj))notes.push("Hai raggiunto il limite di correzioni automatiche: meglio sentire una dietista.");
    adj=real;p.kcalAdj=(num(p.kcalAdj)||0)+adj;
    const plan=S.nutrition.plan;if(adj&&plan){plan.dayTargets=plan.dayTargets||{};plan.days.forEach(d=>plan.dayTargets[d.day]=Math.max(floor,(plan.dayTargets[d.day]||base)+adj));fitPlan(plan);save("nutrition");notes.push("Ho aggiornato le grammature del piano.")}}
  const wk=S.training.workouts.filter(w=>w.date>addDays(t,-7)).length;
  notes.push(`Allenamenti negli ultimi 7 giorni: ${wk} su ${p.days} previsti.`);
  const st=stalledExercises();if(st.length)notes.push(`Carichi fermi da 3 sedute: ${st.map(s=>s.name).join(", ")}. Prova una settimana di scarico (−10% sul peso, stesse ripetizioni) oppure cambia intervallo di ripetizioni.`);

   <div class="hint small">Obiettivo calorico ora: <b>${targets().kcal} kcal</b>${adj?` (${adj>0?"+":""}${adj})`:""}. Il prossimo controllo tra 7 giorni.</div>`);
}
function checkinCard(){
