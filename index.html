<style>
:root{

}

  --bg:#0B0D12;--surface:#151922;--surface2:#1D2230;--line:#2A3040;--text:#F2F4F8;--muted:#98A1B3;
  --brand:#3D7BFF;--brandSoft:rgba(61,123,255,.16);--success:#2ECC8F;--successSoft:rgba(46,204,143,.14);
  --warn:#F2A93B;--danger:#FF6B6B;--protein:#FF7A9A;--carb:#F5B94A;--fat:#9C85FF;--shadow:none;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0B0D12;--surface:#151922;--surface2:#1D2230;--line:#2A3040;--text:#F2F4F8;--muted:#98A1B3;
  --brand:#3D7BFF;--brandSoft:rgba(61,123,255,.16);--success:#2ECC8F;--successSoft:rgba(46,204,143,.14);
  --warn:#F2A93B;--danger:#FF6B6B;--protein:#FF7A9A;--carb:#F5B94A;--fat:#9C85FF;--shadow:none;color-scheme:dark;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}

.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;padding:4px 12px 16px;display:flex;align-items:center;gap:8px}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--brand);display:inline-block;position:relative}
.logo i:after{content:"";position:absolute;inset:7px 5px;border:2.5px solid #fff;border-radius:3px;border-top:none;border-bottom:none}
.navbtn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:0;background:none;cursor:pointer;text-align:left;color:var(--muted);font-weight:600}
.navbtn svg{width:20px;height:20px;flex:none}

main{flex:1;min-width:0;padding:28px 32px 100px;max-width:1100px}
h1{font-size:28px;letter-spacing:-.6px;margin:0 0 4px}

.sub{color:var(--muted);margin:0 0 20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}

.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--surface2);color:var(--text);display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{filter:brightness(1.06)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--surface2);font-size:12px;font-weight:600;color:var(--muted)}

input[type=text],input[type=number],input[type=date],input:not([type]),select,textarea{width:100%;background:var(--surface2);border:1px solid transparent;border-radius:10px;padding:9px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
textarea{resize:vertical;min-height:90px}
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.big{font-size:32px;font-weight:800;letter-spacing:-1px}
.stat{display:flex;flex-direction:column}.stat b{font-size:20px}.stat span{font-size:12px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px}
.list>*{padding:12px 0;border-top:1px solid var(--line)}.list>*:first-child{border-top:0}

.ring>div{width:96px;height:96px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;line-height:1.1}
.tabs{display:flex;gap:6px;background:var(--surface2);padding:4px;border-radius:12px;width:max-content;max-width:100%;overflow:auto;margin-bottom:18px}

.tabs button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
table.sets{width:100%;border-collapse:collapse}

table.sets input{text-align:center;padding:7px 4px}
table.sets tr.done td{background:var(--successSoft)}
table.sets tr.done td:first-child{border-radius:8px 0 0 8px}table.sets tr.done td:last-child{border-radius:0 8px 8px 0}
.chk{width:34px;height:34px;border-radius:9px;border:0;background:var(--surface2);cursor:pointer;font-weight:800}
tr.done .chk{background:var(--success);color:#fff}
.overlay{position:fixed;inset:0;background:rgba(5,8,14,.55);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
.modal{background:var(--bg);border:1px solid var(--line);border-radius:18px;width:min(720px,100%);padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal.wide{width:min(980px,100%)}
.bubble{padding:10px 14px;border-radius:14px;max-width:80%;white-space:pre-wrap;word-wrap:break-word}
.bubble.u{background:var(--brand);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.bubble.a{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.chat{display:flex;flex-direction:column;gap:10px;max-height:58vh;overflow:auto;padding:4px}
.restbar{flex-wrap:wrap;background:var(--brand);color:#fff;border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;margin-bottom:12px}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:99;max-width:90vw}
.shop-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.shop-item.done .nm{text-decoration:line-through;color:var(--muted)}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;cursor:pointer;display:grid;place-items:center;background:none;padding:0}
.done .box{background:var(--success);border-color:var(--success);color:#fff}
.exrow{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;cursor:pointer}
.exrow:hover{background:var(--surface2)}
.av{width:38px;height:38px;border-radius:10px;background:var(--brandSoft);color:var(--brand);display:grid;place-items:center;font-weight:800;flex:none;font-size:13px}
.activebar{position:fixed;right:20px;bottom:20px;z-index:40}
.day{border:1px solid var(--line);border-radius:12px;padding:12px}
.meal{padding:8px 0;border-top:1px dashed var(--line)}.meal:first-of-type{border-top:0}
.hint{background:var(--brandSoft);border-radius:12px;padding:12px 14px;color:var(--text)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.exth{position:relative;overflow:hidden;border-radius:10px;background:#fff;flex:none;border:1px solid var(--line)}
.exth img{position:absolute;top:0;width:auto;max-width:none}
.exanim{position:relative;overflow:hidden;border-radius:14px;background:#fff;width:100%;max-width:420px;margin:0 auto}
.exanim img{position:absolute;top:0;left:0;height:100%;width:200%;max-width:none;animation:flip 1.6s steps(1) infinite}

@media (prefers-reduced-motion:reduce){.exanim img{animation:none}}
.steps{margin:6px 0 12px;padding-left:20px}.steps li{margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cd{padding:6px 0;border-radius:8px;font-size:13px;font-weight:600}
.cd.out{opacity:.35}.cd.on{background:var(--brand);color:#fff}.cd.now{outline:2px solid var(--brand);outline-offset:-2px}
.stype{width:30px;height:30px;border-radius:8px;border:0;background:var(--surface2);font-weight:800;cursor:pointer}

.whead{position:sticky;top:-22px;z-index:6;background:var(--bg);margin:-22px -22px 0;padding:16px 22px 10px;border-bottom:1px solid var(--line)}
.titlein{font-size:18px;font-weight:700;background:none!important;padding:2px 0!important;border:0!important}
.note{font-size:13px;padding:6px 10px!important;margin-top:8px}
select.mini{width:auto;padding:3px 6px;font-size:12px}
.btn.light{background:rgba(255,255,255,.2);color:#fff}
.progcard{margin-top:10px;background:var(--surface2);border-radius:12px;padding:12px;color:var(--text);white-space:normal}
.exblock.ss{border-left:4px solid var(--brand)}
details{border-top:1px solid var(--line);padding:8px 0}details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between}

.fields.f4{grid-template-columns:repeat(4,1fr)}

table.week thead .mealcol{z-index:3}
table.week td{cursor:pointer;height:92px}table.week td:hover{background:var(--surface2)}
table.week .now{background:var(--brandSoft)}table.week thead th.now{color:var(--brand);background:var(--surface);box-shadow:inset 0 -3px 0 var(--brand)}
table.week .cn{font-weight:600;line-height:1.3}table.week .cf{margin-top:3px;line-height:1.3}
table.week .eaten{margin-top:6px;font-size:12px;font-weight:600;color:var(--success)}

.kstep{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.kn{width:26px;height:26px;border-radius:50%;background:var(--brandSoft);color:var(--brand);display:grid;place-items:center;font-weight:800;flex:none;font-size:13px}.mono{font-variant-numeric:tabular-nums}
.card.quiet{box-shadow:none;background:transparent}
.card.due{border-color:var(--brand);box-shadow:0 0 0 2px var(--brandSoft)}
.warnbox{background:rgba(242,169,59,.15)}
iframe.report{width:100%;height:70vh;border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:12px}
nav.bottom{display:none}

  main{padding:18px 16px 110px}

  .modal{padding:0 16px 40px}.modal>*:first-child{margin-top:16px}.modal>.whead:first-child{margin-top:0}

  table.sets td,table.sets th{padding:4px 2px}
  .wgrid{max-height:72vh}table.week{min-width:860px}table.week .mealcol{width:84px}table.week th,table.week td{padding:6px;font-size:12px}
  .ring{width:100px;height:100px}.ring>div{width:80px;height:80px}
}
.micfab{position:fixed;right:20px;bottom:20px;z-index:45;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--brand);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.18)}

@keyframes micp{0%,100%{box-shadow:0 0 0 0 rgba(210,59,59,.45)}50%{box-shadow:0 0 0 8px rgba(210,59,59,0)}}
body:has(#workoutModal) .micfab{display:none}
body:has(#activebar button) .activebar{right:84px}
.restbar.idle{background:var(--surface2);color:var(--muted)}
.restbar.idle .btn{background:var(--brand);color:#fff}
@media (max-width:760px){.micfab{right:12px;bottom:76px;width:48px;height:48px}body:has(#activebar button) .activebar{right:70px}.micbtn span{display:none}}
@media (prefers-reduced-motion:reduce){.micfab.on,.micbtn.on{animation:none}}
.hq{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.hq:first-child{border-top:0}.hq .chips{flex:none;flex-wrap:nowrap}
.chip.warnchip{background:var(--warn);border-color:var(--warn)}
.chip.xs{padding:3px 10px;font-size:12px}
.hq .chips,.rirrow .chips{margin:0}
.rirrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
@media (max-width:760px){.hq{flex-direction:column;align-items:flex-start;gap:6px}}

// ================= DATA
const EX = [["Ab_Crunch_Machine","Crunch alla macchina","Addome","Macchina",0.667,["Seleziona un carico leggero e siediti sulla macchina per addominali, posizionando i piedi sotto gli appositi cuscinetti e afferrando le maniglie superiori.","Piega le braccia a circa 90 gradi appoggiando i tricipiti sui cuscinetti: questa e la posizione di partenza.","Solleva le gambe mentre esegui il crunch con il busto, espirando durante il movimento.","Dopo una breve pausa, torna lentamente alla posizione di partenza inspirando.","Ripeti per il numero di ripetizioni previsto."],"Muoviti in modo lento e controllato, usando gli addominali per spostare il peso e mantenendo gambe e piedi rilassati."],["Ab_Roller","Ab wheel (ruota addominali)","Addome","Altro",0.667,["Afferra la ruota per addominali con entrambe le mani e inginocchiati a terra.","Posiziona la ruota a terra davanti a te, in appoggio su mani e ginocchia: questa e la posizione di partenza.","Fai rotolare lentamente la ruota in avanti, distendendo il corpo il piu possibile senza toccare terra, inspirando durante il movimento.","Dopo una breve pausa nella posizione allungata, torna alla posizione di partenza espirando."],"Esegui il movimento lentamente e tieni gli addominali contratti per tutta la durata dell'esercizio."],["Air_Bike","Bicicletta a terra (addominali)","Addome","Corpo libero",0.667,["Sdraiati a terra con la parte bassa della schiena premuta al pavimento e le mani ai lati della testa, senza tirare il collo.","Solleva le spalle in posizione di crunch e porta le ginocchia perpendicolari al pavimento, con le gambe parallele al suolo: questa e la posizione di partenza.","Simula una pedalata portando il gomito destro verso il ginocchio sinistro mentre estendi la gamba destra, espirando.","Torna alla posizione iniziale inspirando, poi ripeti dal lato opposto espirando.","Continua ad alternare i lati fino a completare tutte le ripetizioni previste."],"Evita di tirare il collo con le mani e mantieni il movimento fluido e controllato."],["Alternate_Hammer_Curl","Curl a martello alternato","Bicipiti","Manubri",0.667,["In piedi con il busto eretto, tieni un manubrio per mano a braccia distese lungo i fianchi, gomiti vicini al busto.","Ruota i palmi verso il busto: questa e la posizione di partenza.","Mantenendo fermo il braccio superiore, solleva il manubrio destro contraendo il bicipite ed espirando, fino a portarlo all'altezza della spalla.","Torna lentamente alla posizione di partenza inspirando, poi ripeti con il braccio sinistro.","Continua alternando i due bracci per il numero di ripetizioni previsto."],"Muovi solo l'avambraccio, mantenendo il braccio superiore e i gomiti fermi durante tutto il movimento."],["Arnold_Dumbbell_Press","Arnold press","Spalle","Manubri",0.667,["Siediti su una panca con schienale e tieni due manubri davanti al petto, palmi rivolti verso di te e gomiti piegati.","Solleva i manubri ruotando i palmi in avanti mentre estendi le braccia sopra la testa, espirando.","Dopo una breve pausa in alto, abbassa i manubri ruotando i palmi verso di te fino alla posizione di partenza, inspirando.","Ripeti per il numero di ripetizioni previsto."],"Ruota i polsi in modo coordinato durante tutta la spinta, senza inarcare eccessivamente la schiena."],["Band_Assisted_Pull-Up","Trazioni assistite con elastico","Dorsali","Altro",1.5,["Fissa l'elastico al centro della sbarra per trazioni, scegliendo la resistenza adatta.","Tira l'estremita dell'elastico verso il basso e infila un ginocchio piegato nell'anello, assicurandoti che non scivoli; afferra la sbarra con una presa medio-larga.","Tirati verso l'alto contraendo i dorsali e piegando i gomiti, portando il mento sopra la sbarra.","Dopo una breve pausa, torna alla posizione di partenza."],"Evita movimenti a slancio o a scatti, controllando il movimento con i dorsali."],["Band_Pull_Apart","Band pull apart","Spalle","Elastici",0.667,["Tieni le braccia distese davanti a te, afferrando l'elastico con entrambe le mani.","Apri lateralmente le braccia con un movimento simile a una croce inversa, mantenendo i gomiti estesi.","Porta l'elastico verso il petto, tenendo le spalle indietro.","Fai una pausa a fine movimento e torna alla posizione di partenza in modo controllato."],"Mantieni le spalle basse e indietro per coinvolgere correttamente i muscoli della schiena alta."],["Barbell_Bench_Press_-_Medium_Grip","Panca piana (bilanciere)","Petto","Bilanciere",0.667,["Sdraiati su una panca piana e afferra il bilanciere con una presa media, che crea un angolo di 90 gradi tra avambraccio e braccio.","Solleva il bilanciere dal rack e tienilo disteso sopra di te a braccia bloccate: questa e la posizione di partenza.","Inspirando, abbassa lentamente il bilanciere fino a sfiorare il petto.","Dopo una breve pausa, spingi il bilanciere verso l'alto espirando, usando i muscoli pettorali e bloccando le braccia in alto.","Ripeti per il numero di ripetizioni previsto e poi riponi il bilanciere sul rack."],"Abbassa il bilanciere il doppio piu lentamente rispetto alla fase di spinta per un miglior controllo."],["Barbell_Curl","Curl con bilanciere","Bicipiti","Bilanciere",0.667,["In piedi con il busto eretto, afferra il bilanciere con presa larghezza spalle, palmi in avanti e gomiti vicini al busto: questa e la posizione di partenza.","Mantenendo fermi i bracci superiori, solleva il bilanciere contraendo i bicipiti ed espirando.","Continua fino a portare il bilanciere all'altezza delle spalle, tenendo la contrazione per un secondo.","Torna lentamente alla posizione di partenza inspirando.","Ripeti per il numero di ripetizioni previsto."],"Muovi solo gli avambracci, mantenendo i gomiti fermi lungo i fianchi per isolare i bicipiti."],["Barbell_Deadlift","Stacco da terra (bilanciere)","Lombari","Bilanciere",0.667,["Mettiti in piedi davanti al bilanciere caricato.","Tenendo la schiena dritta, piega le ginocchia e il busto in avanti afferrando il bilanciere con presa prona larghezza spalle.","Solleva il bilanciere spingendo con le gambe e raddrizzando il busto contemporaneamente, espirando; in piedi, porta il petto in fuori e le scapole indietro.","Torna alla posizione di partenza piegando le ginocchia e inclinando il busto in avanti mantenendo la schiena dritta, fino a poggiare i dischi a terra.","Ripeti per il numero di ripetizioni previsto dal programma."],"Mantieni sempre la schiena dritta durante tutto il movimento per proteggere la zona lombare."],["Barbell_Full_Squat","Squat completo (bilanciere)","Quadricipiti","Bilanciere",0.667,["Posiziona il bilanciere su un rack appena sopra l'altezza delle spalle e caricalo, poi mettiti sotto la barra appoggiandola sulla parte alta della schiena, poco sotto il collo.","Afferra il bilanciere con entrambe le mani e sollevalo dal rack spingendo con le gambe mentre raddrizzi il busto.","Allontanati dal rack e posiziona i piedi larghezza spalle con le punte leggermente verso l'esterno: questa e la posizione di partenza.","Abbassa lentamente il bilanciere piegando le ginocchia e sedendoti all'indietro con i fianchi, mantenendo la schiena dritta e la testa alta, inspirando, fino a portare i femorali sui polpacci.","Risali espirando, spingendo il pavimento con il tallone o la parte centrale del piede fino a tornare alla posizione di partenza."],"Mantieni sempre la schiena dritta e la testa alta durante tutta la discesa e la risalita."],["Barbell_Glute_Bridge","Ponte glutei con bilanciere","Glutei","Bilanciere",0.667,["Siediti a terra con il bilanciere caricato appoggiato sulle gambe, poi fai rotolare la barra sopra i fianchi e sdraiati a terra.","Spingi con i talloni estendendo i fianchi verso l'alto attraverso il bilanciere, con il peso sostenuto dalla parte alta della schiena e dai talloni.","Estendi il piu possibile, poi inverti il movimento tornando alla posizione di partenza."],"Usa un bilanciere imbottito o un bar pad per ridurre il fastidio sui fianchi durante l'esercizio."],["Barbell_Hack_Squat","Hack squat con bilanciere","Quadricipiti","Bilanciere",0.667,["In piedi, tieni il bilanciere dietro di te a braccia distese, piedi larghezza spalle, palmi rivolti indietro: questa e la posizione di partenza.","Mantenendo testa e sguardo alti e la schiena dritta, scendi in squat fino a portare le cosce parallele al pavimento, inspirando.","Risali spingendo principalmente con il tallone e contraendo le cosce, espirando.","Ripeti per il numero di ripetizioni previsto."],"Usa dei polsini se hai difficolta a mantenere la presa del bilanciere dietro il corpo."],["Barbell_Hip_Thrust","Hip thrust con bilanciere","Glutei","Bilanciere",0.667,["Siediti a terra con una panca dietro di te e il bilanciere caricato appoggiato sulle gambe.","Fai rotolare la barra sopra i fianchi e appoggia la schiena alla panca in modo che le scapole siano vicino al bordo superiore.","Spingi con i piedi estendendo i fianchi verso l'alto attraverso il bilanciere, con il peso sostenuto da scapole e piedi, poi inverti il movimento tornando alla posizione di partenza."],"Proteggi i fianchi con un bar pad o un asciugamano arrotolato sul bilanciere."],["Barbell_Incline_Bench_Press_-_Medium_Grip","Panca inclinata (bilanciere)","Petto","Bilanciere",0.667,["Sdraiati su una panca inclinata e afferra il bilanciere con presa media, che crea un angolo di 90 gradi tra avambraccio e braccio.","Solleva il bilanciere dal rack e tienilo disteso sopra di te a braccia bloccate: questa e la posizione di partenza.","Inspirando, abbassa lentamente il bilanciere fino a sfiorare la parte alta del petto.","Dopo una breve pausa, spingi il bilanciere verso l'alto espirando usando i muscoli pettorali, bloccando le braccia in alto.","Ripeti per il numero di ripetizioni previsto e poi riponi il bilanciere sul rack."],"La fase di discesa dovrebbe durare almeno il doppio rispetto alla fase di spinta."],["Barbell_Lunge","Affondi con bilanciere","Quadricipiti","Bilanciere",0.667,["Posiziona il bilanciere su un rack appena sotto l'altezza delle spalle, poi mettiti sotto la barra appoggiandola sulla parte alta della schiena, poco sotto il collo.","Solleva il bilanciere dal rack spingendo con le gambe mentre raddrizzi il busto, poi allontanati dal rack.","Fai un passo avanti con la gamba destra e scendi in affondo mantenendo il busto eretto e l'equilibrio, inspirando; non far avanzare il ginocchio oltre la punta del piede.","Spingi principalmente con il tallone e torna alla posizione di partenza espirando.","Ripeti per il numero di ripetizioni previsto e poi cambia gamba."],"Non lasciare che il ginocchio anteriore superi la punta del piede in fase di discesa, per non sovraccaricare l'articolazione."],["Barbell_Shoulder_Press","Shoulder press con bilanciere","Spalle","Bilanciere",0.667,["Siediti su una panca con schienale dentro un power rack e afferra il bilanciere con presa prona, palmi in avanti.","Solleva il bilanciere sopra la testa bloccando le braccia, tenendolo all'altezza delle spalle e leggermente davanti alla testa: questa e la posizione di partenza.","Abbassa lentamente il bilanciere verso le spalle inspirando.","Spingi il bilanciere verso l'alto tornando alla posizione di partenza, espirando.","Ripeti per il numero di ripetizioni previsto."],"Mantieni il busto stabile e non inarcare eccessivamente la schiena durante la spinta."],["Barbell_Shrug","Scrollate con bilanciere","Trapezi","Bilanciere",0.667,["In piedi con i piedi larghezza spalle, afferra il bilanciere davanti a te con presa prona leggermente piu larga delle spalle: questa e la posizione di partenza.","Solleva le spalle il piu possibile verso l'alto espirando, mantenendo la contrazione per un secondo.","Torna lentamente alla posizione di partenza inspirando.","Ripeti per il numero di ripetizioni previsto."],"Solleva le spalle senza usare i bicipiti per tirare il bilanciere."],["Barbell_Squat","Squat con bilanciere","Quadricipiti","Bilanciere",0.667,["Posiziona il bilanciere su un rack appena sotto l'altezza delle spalle e caricalo, poi mettiti sotto la barra appoggiandola sulla parte alta della schiena, poco sotto il collo.","Afferra il bilanciere con entrambe le mani e sollevalo dal rack spingendo con le gambe mentre raddrizzi il busto.","Allontanati dal rack e posiziona i piedi larghezza spalle con le punte leggermente verso l'esterno, testa alta e schiena dritta: questa e la posizione di partenza.","Abbassa lentamente il bilanciere piegando ginocchia e fianchi, mantenendo la schiena dritta, fino a un angolo leggermente inferiore ai 90 gradi tra coscia e polpaccio, inspirando.","Risali espirando spingendo il pavimento con il tallone, tornando alla posizione di partenza."],"Non lasciare che le ginocchia superino la linea delle punte dei piedi, per non sovraccaricare l'articolazione."],["Barbell_Step_Ups","Step-up con bilanciere","Quadricipiti","Bilanciere",0.667,["In piedi, tieni il bilanciere sulla parte alta della schiena, poco sotto il collo, davanti a una pedana rialzata: questa e la posizione di partenza.","Appoggia il piede destro sulla pedana e sali estendendo anca e ginocchio destro, usando principalmente il tallone, poi porta anche il piede sinistro sulla pedana, espirando.","Scendi con la gamba sinistra flettendo anca e ginocchio destro, inspirando, tornando alla posizione di partenza.","Ripeti con la gamba destra per il numero di ripetizioni previsto, poi cambia gamba."],"Usa principalmente il tallone per spingerti verso l'alto sulla pedana."],["Barbell_Walking_Lunge","Affondi in camminata (bilanciere)","Quadricipiti","Bilanciere",0.667,["In piedi con i piedi larghezza spalle e il bilanciere sulla parte alta della schiena.","Fai un passo avanti con una gamba, piegando le ginocchia per abbassare i fianchi, fino a sfiorare quasi terra con il ginocchio posteriore, mantenendo il busto eretto.","Spingi con il tallone della gamba avanti ed estendi entrambe le ginocchia per risalire.","Fai un passo avanti con la gamba posteriore, ripetendo l'affondo con la gamba opposta."],"Mantieni il ginocchio anteriore allineato sopra il piede durante tutto il movimento."],["Battling_Ropes","Battle rope","Spalle","Altro",1.5,["Ancora una corda pesante al centro, a qualche metro di distanza, e afferra un'estremita per mano con le braccia distese lungo i fianchi: questa e la posizione di partenza.","Solleva rapidamente un braccio fino all'altezza della spalla il piu velocemente possibile.","Mentre quel braccio scende, solleva il braccio opposto.","Continua ad alternare i due bracci, facendo oscillare le corde su e giu il piu velocemente possibile."],"Mantieni il core contratto per stabilizzare il busto durante i movimenti rapidi delle braccia."],["Bench_Dips","Dip su panca","Tricipiti","Corpo libero",0.667,["Metti una panca dietro di te, con le braccia distese appoggiate al bordo, larghezza spalle, e le gambe estese in avanti: questa e la posizione di partenza.","Abbassa lentamente il corpo piegando i gomiti fino a un angolo leggermente inferiore ai 90 gradi, inspirando.","Spingi con i tricipiti per risalire alla posizione di partenza.","Ripeti per il numero di ripetizioni previsto."],"Tieni i gomiti il piu vicino possibile al corpo per non sovraccaricare le spalle."],["Bent_Over_Barbell_Row","Rematore con bilanciere","Dorso","Bilanciere",0.667,["Afferra il bilanciere con presa prona, piega leggermente le ginocchia e inclina il busto in avanti mantenendo la schiena dritta, quasi parallela al pavimento: questa e la posizione di partenza.","Mantenendo il busto fermo, tira il bilanciere verso di te espirando, tenendo i gomiti vicini al corpo.","Nella posizione contratta, contrai i muscoli della schiena per un istante.","Abbassa lentamente il bilanciere alla posizione di partenza inspirando.","Ripeti per il numero di ripetizioni previsto."],"Mantieni la testa alta e la schiena dritta per tutta la durata dell'esercizio."],["Bent_Over_Two-Dumbbell_Row","Rematore con due manubri","Dorso","Manubri",0.667,["Con un manubrio per mano, palmi verso il busto, piega leggermente le ginocchia e inclina il busto in avanti mantenendo la schiena dritta, quasi parallela al pavimento: questa e la posizione di partenza.","Mantenendo il busto fermo, tira i manubri verso i fianchi espirando, tenendo i gomiti vicini al corpo.","Nella posizione contratta, contrai i muscoli della schiena per un secondo.","Abbassa lentamente i manubri alla posizione di partenza inspirando.","Ripeti per il numero di ripetizioni previsto."],"Mantieni la testa alta durante tutto il movimento per proteggere la zona lombare."],["Bodyweight_Squat","Squat a corpo libero","Quadricipiti","Corpo libero",0.667,["In piedi con i piedi larghezza spalle, mani dietro la testa se preferisci: questa e la posizione di partenza.","Piega ginocchia e fianchi sedendoti all'indietro con i fianchi.","Scendi fino alla massima profondita possibile e risali rapidamente tornando alla posizione di partenza, mantenendo testa e petto alti e spingendo le ginocchia verso l'esterno."],"Mantieni petto e testa alti durante tutta la discesa per non arrotondare la schiena."],["Bodyweight_Walking_Lunge","Affondi in camminata a corpo libero","Quadricipiti","Altro",0.667,["In piedi con i piedi larghezza spalle e le mani sui fianchi.","Fai un passo avanti con una gamba, piegando le ginocchia per abbassare i fianchi, fino a sfiorare quasi terra con il ginocchio posteriore, mantenendo il busto eretto.","Spingi con il tallone della gamba avanti ed estendi entrambe le ginocchia per risalire.","Fai un passo avanti con la gamba posteriore, ripetendo l'affondo con la gamba opposta."],"Mantieni il ginocchio anteriore sopra il piede, senza farlo avanzare troppo in fase di discesa."],["Box_Squat","Box squat","Quadricipiti","Bilanciere",0.667,["Mettiti in un power rack con una panca o box all'altezza adeguata dietro di te.","Posizionati sotto il bilanciere appoggiandolo sulla parte alta della schiena, stringendo le scapole e ruotando i gomiti in avanti, poi solleva la barra dal rack e fai un passo indietro.","Con schiena, spalle e core contratti, spingi ginocchia e bacino all'indietro sedendoti sul box fino a toccarlo, tenendo gli stinchi perpendicolari al pavimento; fai una pausa senza rimbalzare.","Mantenendo il peso sui talloni e spingendo piedi e ginocchia verso l'esterno, risali guidando il movimento con la testa."],"Non rimbalzare mai sul box: fai una pausa controllata prima di risalire."],["Butt_Lift_Bridge","Ponte glutei a corpo libero","Glutei","Corpo libero",0.667,["Sdraiati a terra sulla schiena con le mani ai lati e le ginocchia piegate, piedi larghezza spalle: questa e la posizione di partenza.","Spingendo principalmente con i talloni, solleva i fianchi da terra mantenendo la schiena dritta, espirando, e mantieni la contrazione in alto per un secondo.","Torna lentamente alla posizione di partenza inspirando."],"Spingi soprattutto con i talloni per attivare al meglio i glutei."],["Butterfly","Pectoral machine (butterfly)","Petto","Macchina",0.667,["Siediti sulla macchina con la schiena appoggiata allo schienale.","Afferra le maniglie tenendo le braccia superiori parallele al pavimento, regolando la macchina se necessario: questa e la posizione di partenza.","Spingi lentamente le maniglie l'una verso l'altra contraendo il petto al centro, espirando, e mantieni la contrazione per un secondo.","Torna lentamente alla posizione di partenza inspirando, fino a sentire un buon allungamento del petto.","Ripeti per il numero di ripetizioni previsto."],"Regola le maniglie in modo che le braccia superiori restino parallele al pavimento per un movimento corretto."],["Cable_Chest_Press","Chest press ai cavi","Petto","Cavi",0.667,["Regola il peso e siediti afferrando le maniglie, con le braccia superiori a circa 45 gradi dal busto e i gomiti piegati a 90 gradi: questa e la posizione di partenza.","Estendi i gomiti spingendo le maniglie in avanti fino a unirle davanti a te, mantenendo le scapole retratte.","Dopo una pausa a braccia estese, torna alla posizione di partenza mantenendo tensione sui cavi."],"Mantieni le scapole retratte durante tutto il movimento per proteggere le spalle."],["Cable_Crossover","Croci ai cavi (cable crossover)","Petto","Cavi",0.667,["Posiziona le carrucole in alto sopra la testa, seleziona il carico e afferra le maniglie con entrambe le mani.","Fai un passo avanti tra le due carrucole, con il busto leggermente inclinato in avanti e le braccia unite davanti a te: questa e la posizione di partenza.","Con un leggero piega ai gomiti, apri le braccia lateralmente in un ampio arco fino a sentire l'allungamento del petto, inspirando.","Riporta le braccia alla posizione di partenza espirando, seguendo lo stesso arco di movimento.","Fai una breve pausa e ripeti per il numero di ripetizioni previsto."],"Mantieni braccia e busto fermi: il movimento deve avvenire solo a livello della spalla."],["Cable_Crunch","Crunch ai cavi","Addome","Cavi",0.667,["Inginocchiati sotto una carrucola alta con una corda attaccata.","Afferra la corda e abbassala finche le mani non sono vicine al viso.","Flettendo leggermente i fianchi, lascia che il peso iperestenda la parte bassa della schiena: questa e la posizione di partenza.","Con i fianchi fermi, fletti il busto contraendo gli addominali fino a portare i gomiti verso il centro delle cosce, espirando, e mantieni la contrazione per un secondo.","Torna lentamente alla posizione di partenza inspirando."],"Non scegliere un carico troppo pesante: gli addominali, non la zona lombare, devono lavorare durante il movimento."],["Cable_Hammer_Curls_-_Rope_Attachment","Curl a martello ai cavi con corda","Bicipiti","Cavi",0.667,["Fissa una corda a una carrucola bassa e mettiti in piedi a circa 30 cm dalla macchina.","Afferra la corda con presa neutra (palmi rivolti verso l'interno) e resta dritto, mantenendo il busto fermo.","Tieni i gomiti vicini ai fianchi per tutto il movimento: questa e la posizione di partenza.","Usando i bicipiti, tira le braccia verso l'alto espirando fino a portare i bicipiti a contatto con gli avambracci.","Dopo una contrazione di un secondo, riporta lentamente il peso alla posizione di partenza."],"Muovi solo gli avambracci, tenendo i gomiti fermi lungo i fianchi per tutta la ripetizione."],["Cable_Hip_Adduction","Adduzioni ai cavi","Quadricipiti","Cavi",0.667,["Mettiti davanti a una carrucola bassa con una gamba vicino alla macchina e l'altra lontana.","Fissa il cavigliera al cavo e alla caviglia della gamba vicina alla carrucola.","Allontanati dalla macchina con un'ampia base d'appoggio e afferra il manubrio della carrucola.","In equilibrio sulla gamba senza cavigliera, lascia che la gamba con il cavo venga tirata verso la carrucola: questa e la posizione di partenza.","Porta la gamba con la cavigliera davanti alla gamba d'appoggio usando l'interno coscia per adurre l'anca, espirando.","Torna lentamente alla posizione di partenza inspirando, poi ripeti con la gamba opposta."],"Mantieni il busto stabile e usa solo l'interno coscia per guidare il movimento."],["Cable_Preacher_Curl","Curl alla panca Scott ai cavi","Bicipiti","Cavi",0.667,["Posiziona una panca Scott a circa 60 cm da una carrucola bassa con una barra dritta attaccata.","Siediti alla panca Scott con gomito e braccio superiore ben appoggiati sul cuscinetto e afferra la barra.","Estendi completamente le braccia sopra il cuscinetto della panca: questa e la posizione di partenza.","Tira il peso verso le spalle contraendo i bicipiti al massimo, espirando, e mantieni la contrazione per un secondo.","Abbassa lentamente il peso alla posizione di partenza."],"Mantieni il braccio superiore ben appoggiato sul cuscinetto per isolare correttamente il bicipite."],["Cable_Rear_Delt_Fly","Croci inverse ai cavi","Spalle","Cavi",0.667,["Regola le carrucole all'altezza adeguata sopra la testa e seleziona il carico.","Afferra la carrucola sinistra con la mano destra e quella destra con la mano sinistra, incrociando i cavi davanti a te: questa e la posizione di partenza.","Porta le braccia indietro e verso l'esterno mantenendole distese durante il movimento.","Fai una pausa a fine movimento prima di tornare alla posizione di partenza."],"Mantieni le braccia distese e il movimento controllato per coinvolgere bene i deltoidi posteriori."],["Cable_Rope_Overhead_Triceps_Extension","French press ai cavi con corda","Tricipiti","Cavi",0.667,["Fissa una corda alla carrucola bassa della macchina.","Afferra la corda con entrambe le mani ed estendi le braccia sopra la testa con presa neutra, gomiti vicini alla testa e braccia perpendicolari al pavimento: questa e la posizione di partenza.","Abbassa lentamente la corda dietro la testa mantenendo fermi i bracci superiori, inspirando, fino a sentire l'allungamento dei tricipiti.","Torna alla posizione di partenza contraendo i tricipiti ed espirando.","Ripeti per il numero di ripetizioni previsto."],"Mantieni i gomiti fermi e vicini alla testa per isolare i tricipiti."],["Cable_Seated_Lateral_Raise","Alzate laterali ai cavi","Spalle","Cavi",0.667,["Mettiti al centro di due carrucole basse contrapposte con una panca piana dietro di te, in perpendicolare.","Siediti sul bordo della panca con i piedi davanti alle ginocchia e afferra le maniglie, sinistra con la mano destra e destra con la sinistra.","Piega il busto in avanti mantenendo la schiena piatta, con le braccia distese e un leggero piega ai gomiti: questa e la posizione di partenza.","Mantenendo le braccia ferme, solleva i bracci superiori lateralmente fino all'altezza delle spalle, espirando, e mantieni la contrazione per un secondo.","Abbassa lentamente le braccia alla posizione di partenza inspirando."],"Mantieni un angolo fisso ai gomiti (circa 10-30 gradi) per tutta la durata dell'esercizio."],["Cable_Shoulder_Press","Shoulder press ai cavi","Spalle","Cavi",0.667,["Sposta i cavi alla base delle torri e seleziona il carico adeguato.","Mettiti in piedi tra le due torri e afferra i cavi tenendoli all'altezza delle spalle, palmi in avanti: questa e la posizione di partenza.","Mantenendo testa e petto alti, estendi i gomiti spingendo le maniglie sopra la testa.","Dopo una pausa in alto, torna alla posizione di partenza e ripeti."],"Mantieni il busto eretto durante tutta la spinta per non sovraccaricare la zona lombare."],["Calf_Press_On_The_Leg_Press_Machine","Calf alla leg press","Polpacci","Macchina",0.667,["Siediti sulla leg press e posiziona i piedi sulla pedana con una base d'appoggio media.","Sblocca le sicure e spingi la pedana fino a distendere le gambe senza bloccare le ginocchia, appoggiando solo le punte e gli avampiedi sulla parte bassa della pedana con i talloni fuori: questa e la posizione di partenza.","Spingi sulla pedana sollevando i talloni ed estendendo le caviglie il piu possibile, espirando, mantenendo le ginocchia ferme.","Torna lentamente alla posizione di partenza abbassando i talloni, inspirando.","Ripeti per il numero di ripetizioni previsto."],"Mantieni le ginocchia sempre ferme, senza piegarle durante il movimento."],["Chin-Up","Trazioni presa supina (chin-up)","Dorsali","Corpo libero",0.667,["Afferra la sbarra con i palmi rivolti verso di te e una presa piu stretta della larghezza delle spalle.","Con le braccia distese, mantieni il busto il piu dritto possibile creando una leggera curva lombare e il petto in fuori: questa e la posizione di partenza.","Tira il busto verso l'alto espirando, fino a portare la testa vicino alla sbarra, concentrandoti sui bicipiti e tenendo i gomiti vicini al corpo.","Dopo una contrazione di un secondo, abbassa lentamente il busto alla posizione di partenza inspirando, fino a distendere completamente le braccia.","Ripeti per il numero di ripetizioni previsto."],"Mantieni il busto il piu fermo possibile: solo le braccia devono muoversi durante la trazione."],["Clean_and_Press","Girata e spinta","Spalle","Bilanciere",0.667,["In piedi con i piedi larghezza spalle e le ginocchia interne alle braccia, piega ginocchia e fianchi mantenendo la schiena piatta e afferra il bilanciere con presa prona leggermente piu larga delle spalle, gomiti rivolti all'esterno: questa e la posizione di partenza.","Estendi le ginocchia iniziando a tirare il bilanciere, portando i fianchi in avanti e sollevando le spalle mantenendo la barra vicina al corpo.","Quando la barra supera il ginocchio, estendi con forza caviglie, ginocchia e fianchi come in un salto, tirando la barra il piu in alto possibile con le spalle in shrug.","Alla massima elevazione, i piedi si staccano da terra: scendi in posizione di squat portandoti sotto la barra e ruotando i gomiti per appoggiarla sulla parte alta del petto, mantenendo il busto eretto.","Alzati fino alla posizione eretta tenendo la barra in posizione di clean, poi spingila sopra la testa espirando senza muovere i piedi."],"Mantieni la barra il piu vicino possibile al corpo durante tutta la tirata per un movimento sicuro ed efficiente."],["Close-Grip_Barbell_Bench_Press","Panca presa stretta (bilanciere)","Tricipiti","Bilanciere",0.667,["Sdraiati su una panca piana e afferra il bilanciere con presa stretta, circa larghezza spalle.","Solleva il bilanciere dal rack e tienilo disteso sopra di te a braccia bloccate: questa e la posizione di partenza.","Inspirando, abbassa lentamente il bilanciere fino a sfiorare il centro del petto, tenendo i gomiti vicini al busto per coinvolgere maggiormente i tricipiti.","Dopo una breve pausa, spingi il bilanciere verso l'alto espirando usando i tricipiti, bloccando le braccia in alto.","Ripeti per il numero di ripetizioni previsto e poi riponi il bilanciere sul rack."],"Tieni i gomiti vicini al busto per tutto il movimento, a differenza della panca piana classica."],["Close-Grip_Front_Lat_Pulldown","Lat machine presa stretta","Dorsali","Cavi",0.667,["Siediti alla lat machine con una barra larga fissata alla carrucola alta e regola i cuscinetti per le ginocchia in base alla tua altezza.","Afferra la barra con i palmi in avanti usando una presa stretta, piu vicina della larghezza spalle.","Con le braccia distese davanti a te, inclina il busto indietro di circa 30 gradi mantenendo una leggera curva lombare e il petto in fuori: questa e la posizione di partenza.","Espirando, tira la barra verso il petto portando spalle e braccia superiori indietro e in basso, contraendo bene la schiena nel punto di massima contrazione.","Dopo una pausa, risali lentamente alla posizione di partenza inspirando, contraendo le scapole insieme e distendendo completamente le braccia."],"Muovi solo le braccia mantenendo il busto stabile, senza tirare la barra con gli avambracci."],["Concentration_Curls","Curl di concentrazione","Bicipiti","Manubri",0.667,["Siediti su una panca piana con un manubrio davanti a te, gambe divaricate e piedi a terra.","Afferra il manubrio con la mano destra e appoggia il tricipite sulla parte interna della coscia destra, ruotando il palmo in avanti: questa e la posizione di partenza.","Mantenendo fermo il braccio superiore, solleva il peso contraendo il bicipite ed espirando, fino a portare il manubrio all'altezza della spalla.","Torna lentamente alla posizione di partenza inspirando, evitando movimenti a slancio.","Ripeti per il numero di ripetizioni previsto, poi cambia braccio."],"Evita ogni oscillazione: il movimento deve essere lento e controllato per isolare il bicipite."],["Cross_Body_Hammer_Curl","Curl a martello incrociato","Bicipiti","Manubri",0.667,["In piedi con un manubrio per mano, braccia lungo i fianchi e palmi rivolti verso l'interno.","Senza ruotare il braccio, solleva il manubrio destro verso la spalla sinistra espirando, toccandola e mantenendo la contrazione per un secondo.","Abbassa lentamente il manubrio lungo lo stesso percorso inspirando, poi ripeti con il braccio sinistro.","Continua ad alternare i due bracci fino a completare il numero di ripetizioni previsto per lato."],"Mantieni i palmi rivolti verso l'interno per tutto il movimento, senza ruotare il polso."],["Crunches","Crunch","Addome","Corpo libero",0.667,["Sdraiati sulla schiena con i piedi a terra o appoggiati su una panca con le ginocchia piegate a 90 gradi.","Metti le mani leggermente ai lati della testa senza intrecciare le dita dietro la nuca.","Spingendo la zona lombare verso il pavimento, solleva le spalle da terra di circa 10 centimetri contraendo gli addominali ed espirando, mantenendo la contrazione per un secondo.","Torna lentamente alla posizione di partenza inspirando.","Ripeti per il numero di ripetizioni previsto."],"Usa un movimento lento e controllato, senza aiutarti con lo slancio."],["Dead_Bug","Dead bug","Addome","Corpo libero",0.561,["Sdraiati sulla schiena con le braccia estese verso il soffitto.","Porta piedi, ginocchia e fianchi a 90 gradi.","Espira forte per abbassare la gabbia toracica e appiattire la schiena a terra, ruotando il bacino verso l'alto e contraendo i glutei: questa e la posizione di partenza da mantenere per tutto l'esercizio.","Estendi una gamba, raddrizzando ginocchio e anca fino a portarla appena sopra il pavimento.","Mantieni la posizione di zona lombare e bacino, resistendo alla tendenza della schiena a inarcarsi.","Riporta la gamba alla posizione di partenza e ripeti dal lato opposto, alternando fino a completare la serie."],"Mantieni la schiena piatta a terra per tutta la durata dell'esercizio, senza lasciarla inarcare."],["Decline_Barbell_Bench_Press","Panca declinata (bilanciere)","Petto","Bilanciere",0.667,["Blocca le gambe all'estremita della panca declinata e sdraiati lentamente.","Afferra il bilanciere con presa media, che crea un angolo di 90 gradi tra avambraccio e braccio, e sollevalo dal rack tenendolo disteso sopra di te a braccia bloccate: questa e la posizione di partenza.","Inspirando, abbassa lentamente il bilanciere fino a sfiorare la parte bassa del petto.","Dopo una breve pausa, spingi il bilanciere verso l'alto espirando usando i muscoli pettorali, bloccando le braccia in alto.","Ripeti per il numero di ripetizioni previsto e poi riponi il bilanciere sul rack."],"Fatti aiutare da uno spotter per sollevare e riporre il bilanciere in sicurezza dal rack."],["Decline_Crunch","Crunch su panca declinata","Addome","Corpo libero",0.667,["Blocca le gambe all'estremità della panca declinata e sdraiati.","Appoggia le mani ai lati della testa con i gomiti aperti, senza intrecciare le dita dietro la nuca.","Spingi la zona lombare contro la panca e solleva le spalle staccandole dal piano.","Contrai gli addominali ed espira mentre le spalle salgono di pochi centimetri, mantenendo la schiena bassa sulla panca; tieni la contrazione un secondo.","Torna lentamente alla posizione di partenza inspirando.","Ripeti per il numero di ripetizioni previsto."],"Mantieni la zona lombare premuta sulla panca e muoviti in modo lento e controllato, senza usare lo slancio."],["Decline_Dumbbell_Bench_Press","Panca declinata (manubri)","Petto","Manubri",0.667,["Blocca le gambe all'estremità della panca declinata e sdraiati con un manubrio per mano appoggiato sulle cosce, palmi rivolti l'uno verso l'altro.","Porta i manubri davanti a te all'altezza delle spalle.","Ruota i polsi in avanti finché i palmi non guardano lontano da te: questa è la posizione di partenza.","Abbassa lentamente i pesi ai lati del petto espirando, mantenendo sempre il pieno controllo dei manubri e gli avambracci perpendicolari al pavimento.","Spingi i manubri verso l'alto con i pettorali espirando, blocca le braccia in contrazione, stringi il petto per un secondo e poi scendi lentamente.","Ripeti il movimento per il numero di ripetizioni previsto dal programma."],"Scendi con il doppio del tempo che impieghi a salire, mantenendo gli avambracci perpendicolari al pavimento durante la discesa."],["Decline_Push-Up","Piegamenti declinati","Petto","Altro",0.667,["Sdraiati a faccia in giù, mani distanziate circa 90 cm, corpo sollevato a braccia tese e piedi appoggiati su un box o una panca: questa è la posizione di partenza.","Abbassati inspirando finché il petto non sfiora quasi il pavimento.","Espira e spingi il busto verso l'alto tornando alla posizione di partenza contraendo il petto.","Dopo una breve pausa in alto, ripeti la discesa per il numero di ripetizioni necessario."],"Tieni il corpo dritto e allineato durante tutto il movimento per non caricare in modo scorretto le spalle."],["Deficit_Deadlift","Stacco in deficit","Lombari","Bilanciere",0.667,["Sali su una piattaforma o su dischi alti 3-8 cm, posizionati con il bilanciere centrato sui piedi e i piedi larghi quanto i fianchi.","Piegati sui fianchi e afferra il bilanciere con presa larga quanto le spalle, lasciando che le scapole si aprano leggermente.","Inspira profondamente, abbassa i fianchi e piega le ginocchia finché gli stinchi non toccano il bilanciere.","Guarda avanti, tieni il petto in fuori e la schiena inarcata, e inizia a spingere sui talloni per sollevare il peso.","Dopo che il bilanciere supera le ginocchia, tira le scapole indietro spingendo i fianchi in avanti verso la sbarra.","Abbassa il bilanciere piegando i fianchi e riportandolo lentamente a terra."],"Mantieni la schiena arcuata e il petto in fuori per tutto lo stacco, per non caricare la colonna in flessione."],["Dip_Machine","Dip alla macchina","Tricipiti","Macchina",0.667,["Siediti saldamente sulla macchina per dip, seleziona il peso e afferra bene le maniglie.","Tieni i gomiti vicini ai fianchi per enfatizzare i tricipiti, con un angolo di circa 90 gradi.","Contrai i tricipiti ed estendi le braccia verso il basso espirando, mantenendo una leggera flessione a fine movimento.","Torna lentamente su alla posizione di partenza inspirando.","Ripeti per il numero di ripetizioni previsto."],"Mantieni sempre una leggera flessione dei gomiti in basso per tenere la tensione sui tricipiti e proteggere l'articolazione."],["Dips_-_Chest_Version","Dip alle parallele (petto)","Petto","Altro",0.667,["Sali sulle parallele e mettiti in posizione di partenza a braccia tese sopra le barre.","Inspirando, scendi lentamente inclinando il busto in avanti di circa 30 gradi e aprendo leggermente i gomiti, finché non senti un leggero stiramento del petto.","Usa il petto per tornare alla posizione di partenza espirando, contraendo il petto per un secondo in alto.","Ripeti il movimento per il numero di ripetizioni previsto."],"Inclina il busto in avanti e apri leggermente i gomiti per spostare il lavoro sul petto anziché sui tricipiti."],["Dips_-_Triceps_Version","Dip alle parallele (tricipiti)","Tricipiti","Corpo libero",0.667,["Sali sulle parallele in posizione di partenza, braccia quasi tese, sopra le barre.","Inspira e scendi lentamente mantenendo il busto verticale e i gomiti vicini al corpo, finché il braccio non forma un angolo di 90 gradi.","Espira e spingi il busto verso l'alto usando i tricipiti fino a tornare alla posizione di partenza.","Ripeti il movimento per il numero di ripetizioni previsto."],"Tieni il busto verticale e i gomiti stretti al corpo per concentrare il lavoro sui tricipiti."],["Donkey_Calf_Raises","Donkey calf raise","Polpacci","Altro",0.667,["Posiziona la parte bassa della schiena e i fianchi sotto la leva imbottita della macchina per donkey calf raise, facendo contatto con l'osso sacro.","Appoggia le braccia sui manici laterali, metti gli avampiedi sul supporto lasciando i talloni fuori e allinea le punte nella direzione desiderata, con le ginocchia distese senza bloccarle.","Solleva i talloni espirando, estendendo le caviglie il più possibile e contraendo i polpacci, mantenendo il ginocchio fermo; tieni la contrazione un secondo.","Torna lentamente alla posizione di partenza inspirando, abbassando i talloni fino a sentire lo stiramento dei polpacci.","Ripeti per il numero di ripetizioni previsto."],"Mantieni il ginocchio immobile durante tutto il movimento e concentra il lavoro solo sulla caviglia."],["Dumbbell_Alternate_Bicep_Curl","Curl alternato con manubri","Bicipiti","Manubri",0.667,["Stai in piedi con il busto eretto, un manubrio per mano a braccia tese, gomiti vicini al busto e palmi verso le cosce.","Tenendo fermo il braccio, solleva il manubrio destro ruotando il palmo in avanti finché il bicipite non è completamente contratto e il manubrio è all'altezza della spalla; espira e tieni la contrazione un secondo.","Riporta lentamente il manubrio alla posizione di partenza inspirando, ruotando di nuovo il palmo verso la coscia.","Ripeti il movimento con la mano sinistra: questa è una ripetizione completa.","Continua alternando i lati per il numero di ripetizioni previsto."],"Muovi solo l'avambraccio tenendo il braccio superiore fermo, senza usare slancio."],["Dumbbell_Bench_Press","Panca piana (manubri)","Petto","Manubri",0.667,["Sdraiati su una panca piana con un manubrio per mano appoggiato sulle cosce, palmi l'uno verso l'altro.","Aiutandoti con le cosce, solleva i manubri uno alla volta portandoli davanti a te all'altezza delle spalle.","Ruota i polsi in avanti finché i palmi non guardano lontano da te, con avambraccio e braccio a formare un angolo di 90 gradi: questa è la posizione di partenza.","Spingi i manubri verso l'alto con il petto espirando, blocca le braccia in alto, stringi il petto per un secondo e poi scendi lentamente.","Ripeti il movimento per il numero di ripetizioni previsto dal programma."],"Fai in modo che la discesa duri circa il doppio della salita, mantenendo sempre il controllo dei manubri."],["Dumbbell_Bicep_Curl","Curl con manubri","Bicipiti","Manubri",0.667,["Stai in piedi eretto con un manubrio per mano a braccia tese, gomiti vicini al busto e palmi rivolti in avanti: questa è la posizione di partenza.","Tenendo fermo il braccio superiore, espira e solleva i pesi contraendo i bicipiti finché non sono completamente contratti e i manubri sono all'altezza delle spalle; tieni brevemente la contrazione.","Inspira e abbassa lentamente i manubri alla posizione di partenza.","Ripeti per il numero di ripetizioni previsto."],"Mantieni i gomiti fermi vicino al busto per isolare il lavoro sui bicipiti."],["Dumbbell_Flyes","Croci su panca piana (manubri)","Petto","Manubri",0.667,["Sdraiati su una panca piana con un manubrio per mano sulle cosce, palmi l'uno verso l'altro.","Aiutandoti con le cosce, solleva i manubri uno alla volta portandoli davanti a te all'altezza delle spalle, palmi rivolti tra loro, quasi come in distensione ma senza bloccare i gomiti: questa è la posizione di partenza.","Con una leggera flessione dei gomiti, apri le braccia lateralmente in un ampio arco finché non senti uno stiramento sul petto, inspirando.","Riporta le braccia alla posizione di partenza seguendo lo stesso arco, contraendo il petto ed espirando.","Tieni la contrazione un secondo e ripeti per il numero di ripetizioni previsto."],"Mantieni i gomiti leggermente flessi durante tutto il movimento e lascia che il lavoro avvenga solo all'articolazione della spalla, per proteggere i tendini del bicipite."],["Dumbbell_Incline_Row","Rematore su panca inclinata (manubri)","Dorso","Manubri",0.667,["Con una presa neutra, appoggiati a una panca inclinata.","Prendi un manubrio per mano con presa neutra, braccia tese: questa è la posizione di partenza.","Retrai le scapole e piega i gomiti per tirare i manubri verso il fianco.","Fai una pausa in alto e torna alla posizione di partenza."],"Retrai bene le scapole a ogni ripetizione per coinvolgere correttamente i muscoli della schiena."],["Dumbbell_Lunges","Affondi con manubri","Quadricipiti","Manubri",0.667,["Stai in piedi con il busto eretto tenendo due manubri lungo i fianchi: questa è la posizione di partenza.","Fai un passo avanti con la gamba destra di circa 60 cm e abbassa il busto mantenendolo eretto ed equilibrato, inspirando; non lasciare che il ginocchio superi la punta del piede e tieni lo stinco anteriore perpendicolare al pavimento.","Spingi principalmente con il tallone e torna alla posizione di partenza espirando.","Ripeti il movimento per il numero di ripetizioni previsto, poi cambia gamba."],"Non lasciare che il ginocchio avanzato superi la punta del piede, per non sovraccaricare l'articolazione del ginocchio."],["Dumbbell_Rear_Lunge","Affondi indietro con manubri","Quadricipiti","Manubri",0.667,["Stai in piedi con il busto eretto tenendo due manubri lungo i fianchi: questa è la posizione di partenza.","Fai un passo indietro con la gamba destra di circa 60 cm e abbassa il busto mantenendolo eretto ed equilibrato, inspirando, tenendo lo stinco anteriore perpendicolare al pavimento.","Spingi e torna alla posizione di partenza espirando, usando l'avampiede per enfatizzare i quadricipiti o il tallone per enfatizzare i glutei.","Ripeti con la gamba opposta."],"Non lasciare che il ginocchio anteriore superi la punta del piede durante la discesa, per proteggere l'articolazione."],["Dumbbell_Shoulder_Press","Shoulder press con manubri","Spalle","Manubri",0.667,["Siediti su una panca con schienale tenendo un manubrio per mano, appoggiati verticalmente sulle cosce.","Solleva i manubri all'altezza delle spalle uno alla volta, aiutandoti con le cosce.","Ruota i polsi in modo che i palmi guardino in avanti: questa è la posizione di partenza.","Espira e spingi i manubri verso l'alto finché non si toccano in cima.","Dopo una breve pausa in alto, abbassa lentamente i pesi alla posizione di partenza inspirando.","Ripeti per il numero di ripetizioni previsto."],"Muovi solo le spalle e le braccia, mantenendo il busto stabile contro lo schienale durante tutta la spinta."],["Dumbbell_Shrug","Scrollate con manubri","Trapezi","Manubri",0.667,["Stai in piedi eretto con un manubrio per mano, palmi verso il busto, braccia distese lungo i fianchi.","Solleva i manubri alzando le spalle il più possibile mentre espiri; tieni la contrazione un secondo in alto.","Abbassa i manubri tornando alla posizione iniziale.","Ripeti per il numero di ripetizioni previsto."],"Muovi solo le spalle in verticale, senza piegare i gomiti né usare i bicipiti per aiutare il sollevamento."],["Dumbbell_Squat","Squat con manubri","Quadricipiti","Manubri",0.667,["Stai in piedi eretto tenendo un manubrio per mano, palmi rivolti verso le gambe.","Posiziona i piedi larghi quanto le spalle con le punte leggermente aperte, testa alta e schiena dritta: questa è la posizione di partenza.","Abbassa lentamente il busto piegando le ginocchia mantenendo la postura dritta e la testa alta, finché le cosce non sono parallele al pavimento.","Risali espirando spingendo con il tallone e distendendo le gambe fino alla posizione di partenza.","Ripeti per il numero di ripetizioni previsto."],"Non lasciare che le ginocchia superino la linea delle punte dei piedi durante la discesa, per evitare stress eccessivo sull'articolazione."],["Dumbbell_Step_Ups","Step-up con manubri","Quadricipiti","Manubri",0.667,["Stai in piedi eretto tenendo un manubrio per mano, palmi rivolti verso le gambe.","Metti il piede destro sulla piattaforma rialzata e sali estendendo anca e ginocchio della gamba destra, spingendo soprattutto con il tallone, poi porta anche il piede sinistro sulla piattaforma, espirando durante lo sforzo.","Scendi con la gamba sinistra flettendo anca e ginocchio della gamba destra mentre inspiri, tornando alla posizione iniziale con il piede destro accanto al sinistro.","Ripeti con la gamba destra per il numero di ripetizioni previsto, poi cambia gamba."],"Spingi principalmente con il tallone per mantenere l'equilibrio e proteggere il ginocchio durante la salita."],["EZ-Bar_Curl","Curl con bilanciere EZ","Bicipiti","Bilanciere EZ",0.667,["Stai in piedi eretto tenendo un bilanciere EZ con presa larga, palmi in avanti e leggermente inclinati verso l'interno secondo la forma della barra, gomiti vicini al busto: questa è la posizione di partenza.","Tenendo fermo il braccio superiore, espira e solleva il bilanciere contraendo i bicipiti, muovendo solo gli avambracci.","Continua a sollevare finché i bicipiti non sono completamente contratti e la barra è all'altezza delle spalle; tieni la contrazione un momento.","Inspira e abbassa lentamente la barra alla posizione di partenza.","Ripeti per il numero di ripetizioni previsto."],"Mantieni i gomiti fermi vicino al busto durante tutto il movimento per isolare i bicipiti."],["EZ-Bar_Skullcrusher","French press con bilanciere EZ (skull crusher)","Tricipiti","Bilanciere EZ",0.667,["Con presa stretta, solleva il bilanciere EZ tenendo i gomiti raccolti mentre sei sdraiato sulla panca, con le braccia perpendicolari al pavimento: questa è la posizione di partenza.","Tenendo fermo il braccio superiore, abbassa la barra piegando i gomiti mentre inspiri, fermandoti quando la barra è sopra la fronte.","Riporta la barra alla posizione di partenza estendendo i gomiti ed espirando.","Ripeti."],"Mantieni i gomiti fermi e rivolti verso l'alto per non caricare le spalle durante la discesa della barra."],["External_Rotation_with_Band","Extrarotazioni con elastico","Spalle","Elastici",0.667,["Fissa l'elastico a un palo all'altezza del tuo gomito e mettiti in piedi con il lato sinistro rivolto verso l'elastico, a un paio di passi di distanza.","Afferra l'estremità dell'elastico con la mano destra tenendo il gomito premuto saldamente contro il fianco, eventualmente con un cuscinetto per tenerlo fermo.","Con il braccio in posizione, il gomito flesso a 90 gradi e la mano davanti al busto: questa è la posizione di partenza.","Ruota il braccio verso l'esterno come un rovescio, mantenendo il gomito fermo.","Continua fino al massimo possibile, fai una pausa e torna alla posizione di partenza."],"Tieni il gomito ben fermo contro il fianco per isolare la rotazione della spalla e proteggere l'articolazione."],["External_Rotation_with_Cable","Extrarotazioni ai cavi","Spalle","Cavi",0.667,["Regola il cavo all'altezza del tuo gomito e mettiti in piedi con il lato sinistro rivolto verso il cavo, a un paio di passi di distanza.","Afferra la maniglia con la mano destra tenendo il gomito premuto saldamente contro il fianco, eventualmente con un cuscinetto per tenerlo fermo.","Con il braccio in posizione, il gomito flesso a 90 gradi e la mano davanti al busto: questa è la posizione di partenza.","Ruota il braccio verso l'esterno come un rovescio, mantenendo il gomito fermo."],"Tieni il gomito ben fermo contro il fianco durante tutto il movimento per isolare i rotatori della spalla."],["Face_Pull","Face pull","Spalle","Cavi",0.667,["Mettiti di fronte a una carrucola alta con una corda o due maniglie agganciate.","Tira il peso direttamente verso il viso separando le mani man mano che tiri.","Mantieni le braccia superiori parallele al pavimento per tutto il movimento."],"Mantieni i gomiti alti e le braccia parallele al pavimento per coinvolgere bene i muscoli posteriori della spalla."],["Flat_Bench_Lying_Leg_Raise","Sollevamenti gambe su panca","Addome","Corpo libero",0.667,["Sdraiati con la schiena appoggiata su una panca e le gambe distese oltre il bordo.","Metti le mani sotto i glutei con i palmi verso il basso oppure ai lati aggrappandoti alla panca: questa è la posizione di partenza.","Mantenendo le gambe tese con un leggero blocco alle ginocchia, sollevale finché non formano un angolo di 90 gradi con il pavimento; espira e tieni la contrazione un secondo in alto.","Abbassa lentamente le gambe alla posizione di partenza inspirando."],"Mantieni le mani sotto i glutei o salde alla panca per stabilizzare il bacino ed evitare di inarcare la schiena."],["Flutter_Kicks","Flutter kick","Glutei","Corpo libero",0.667,["Sdraiati a faccia in giù su una panca piana con i fianchi sul bordo, gambe tese con le punte alte da terra e braccia aggrappate al bordo anteriore della panca.","Contrai glutei e femorali e distendi le gambe fino ad allinearle con i fianchi: questa è la posizione di partenza.","Inizia il movimento alzando la gamba sinistra più in alto della destra.","Poi abbassa la gamba sinistra mentre sollevi la destra.","Continua ad alternare (come nel nuoto a rana) per il numero di ripetizioni previsto per ciascuna gamba, mantenendo un movimento controllato."],"Mantieni un movimento sempre controllato e respira normalmente durante l'esercizio."],["Freehand_Jump_Squat","Jump squat","Quadricipiti","Corpo libero",0.667,["Incrocia le braccia sul petto.","Con la testa alta e la schiena dritta, posiziona i piedi larghi quanto le spalle.","Mantenendo schiena dritta e petto in fuori, scendi in squat inspirando finché le cosce non sono parallele, o più basse, rispetto al pavimento.","Spingendo soprattutto con l'avampiede, salta verso l'alto il più possibile usando le cosce come molle, espirando durante il salto.","Quando tocchi terra, scendi subito di nuovo in squat e salta ancora.","Ripeti per il numero di ripetizioni previsto."],"Atterra in modo morbido piegando subito le ginocchia per assorbire l'impatto e proteggere le articolazioni."],["Front_Cable_Raise","Alzate frontali ai cavi","Spalle","Cavi",0.667,["Seleziona il peso su una carrucola bassa e afferra con la mano sinistra la maniglia singola collegata al cavo.","Girati con la schiena verso la carrucola e tieni il braccio disteso davanti alle cosce, palmo verso la coscia: questa è la posizione di partenza.","Mantenendo il busto fermo, senza oscillare, solleva il braccio sinistro in avanti con una leggera flessione del gomito e il palmo sempre verso il basso, finché il braccio non è leggermente sopra il parallelo al pavimento; espira e tieni la contrazione un secondo in alto.","Abbassa lentamente il braccio inspirando, tornando alla posizione di partenza.","Completate le ripetizioni con un braccio, cambia e ripeti con l'altro."],"Mantieni il busto fermo senza oscillare, usando solo la spalla per sollevare il cavo."],["Front_Dumbbell_Raise","Alzate frontali con manubri","Spalle","Manubri",0.667,["Prendi due manubri e stai in piedi con il busto dritto, i manubri davanti alle cosce a braccia tese, palmi verso le cosce: questa è la posizione di partenza.","Mantenendo il busto fermo, senza oscillare, solleva il manubrio sinistro in avanti con una leggera flessione del gomito e il palmo sempre verso il basso, finché il braccio non è leggermente sopra il parallelo; espira e tieni la contrazione un secondo, poi inspira.","Abbassa lentamente il manubrio sinistro mentre contemporaneamente sollevi il destro.","Continua ad alternare finché non hai completato il numero di ripetizioni previsto per ciascun braccio."],"Tieni il busto immobile per tutto l'esercizio, evitando di oscillare per aiutarti con lo slancio."],["Front_Plate_Raise","Alzate frontali con disco","Spalle","Altro",0.667,["In piedi, tieni un disco con entrambe le mani nella posizione ore 3 e ore 9, palmi rivolti l'uno verso l'altro, braccia tese con una leggera flessione ai gomiti, disco davanti al bacino: questa è la posizione di partenza.","Solleva lentamente il disco espirando finché non è leggermente sopra l'altezza delle spalle; tieni la contrazione un secondo, senza oscillare il peso né piegare i gomiti.","Abbassa lentamente il disco alla posizione di partenza inspirando.","Ripeti per il numero di ripetizioni previsto."],"Mantieni il busto stabile e non oscillare il disco: il movimento deve venire solo dalle spalle."],["Front_Squat_Clean_Grip","Front squat","Quadricipiti","Bilanciere",0.667,["Posiziona il bilanciere su un rack poco sotto l'altezza delle spalle e appoggialo sui deltoidi, vicino alle clavicole, con le dita che lo tengono leggermente in posizione con presa da clean.","Solleva il bilanciere dal rack spingendo con le gambe e raddrizzando il busto, allontanati dal rack e posiziona i piedi larghi quanto le spalle con le punte leggermente aperte, testa e gomiti alti: questa è la posizione di partenza.","Piega le ginocchia sedendoti tra le gambe finché i femorali non toccano i polpacci, mantenendo le ginocchia allineate ai piedi spingendole leggermente verso l'esterno.","Risali espirando spingendo soprattutto con il tallone o il centro del piede, distendendo le gambe fino a tornare alla posizione di partenza."],"Mantieni i gomiti alti durante tutto il movimento per tenere il bilanciere stabile sui deltoidi."],["Glute_Ham_Raise","Glute ham raise","Femorali","Macchina",0.667,["Regola l'attrezzo in base al tuo corpo e appoggia i piedi contro la pedana tra i rulli, sdraiandoti a faccia in giù con le ginocchia appena dietro il cuscinetto.","Parti dal fondo del movimento mantenendo la schiena inarcata e inizia flettendo le ginocchia, spingendo le punte dei piedi contro la pedana, fino a portare il corpo in posizione eretta.","Torna alla posizione di partenza controllando la discesa."],"Controlla sempre la discesa mantenendo la schiena inarcata per proteggere la zona lombare."],["Glute_Kickback","Slanci glutei (kickback)","Glutei","Corpo libero",0.667,["Inginocchiati a terra o su un tappetino, piega il busto in avanti con le braccia tese davanti a te in posizione simile a un piegamento, mani larghe quanto le spalle, ginocchia piegate a 90 gradi: questa è la posizione di partenza.","Espirando, solleva la gamba destra finché il femore non è in linea con la schiena, mantenendo l'angolo di 90 gradio al ginocchio, contraendo i glutei e tenendo la contrazione un secondo in alto.","Torna alla posizione iniziale inspirando e ripeti con la gamba sinistra.","Continua alternando le gambe fino a completare tutte le ripetizioni previste."],"Contrai i glutei a ogni ripetizione mantenendo l'angolo di 90 gradi al ginocchio, senza inarcare la schiena."],["Goblet_Squat","Goblet squat","Quadricipiti","Kettlebell",0.669,["Stai in piedi tenendo un kettlebell leggero per le corna, vicino al petto: questa è la posizione di partenza.","Scendi in squat tra le gambe finché i femorali non toccano i polpacci, mantenendo petto e testa alti e schiena dritta.","In fondo al movimento, fai una pausa e usa i gomiti per spingere le ginocchia verso l'esterno, poi torna su ripetendo per 10-20 ripetizioni."],"Usa i gomiti per spingere le ginocchia verso l'esterno in fondo allo squat, mantenendo la schiena dritta."],["Good_Morning","Good morning","Femorali","Bilanciere",0.667,["Parti con il bilanciere su un rack all'altezza delle spalle e caricalo sulla parte posteriore delle spalle, come in uno squat, non in cima; tieni la schiena tesa, le scapole ravvicinate e le ginocchia leggermente piegate, poi allontanati dal rack.","Piega i fianchi spostandoli indietro mentre ti inclini fino a quasi il parallelo, mantenendo la schiena inarcata e il collo allineato.","Inverti il movimento estendendo i fianchi con glutei e femorali finché non torni alla posizione di partenza."],"Mantieni sempre la schiena inarcata e le ginocchia leggermente piegate per proteggere la colonna durante la flessione."],["Hack_Squat","Hack squat (macchina)","Quadricipiti","Macchina",1.0,["Appoggia la schiena contro lo schienale della macchina e aggancia le spalle sotto gli appositi cuscinetti.","Posiziona i piedi sulla pedana larghi quanto le spalle con le punte leggermente aperte, testa alta e schiena sempre appoggiata al cuscinetto.","Appoggia le braccia sulle maniglie laterali e sgancia le sicure.","Distendi le gambe senza bloccare le ginocchia: questa è la posizione di partenza.","Abbassa lentamente il carico piegando le ginocchia, mantenendo la postura dritta e la testa alta, finché l'angolo tra coscia e polpaccio non è leggermente inferiore a 90 gradi, inspirando.","Risali espirando spingendo soprattutto con il tallone, distendendo le gambe fino alla posizione di partenza.","Ripeti per il numero di ripetizioni previsto."],"Non lasciare che le ginocchia superino la linea delle punte dei piedi durante la discesa, per non sovraccaricarle."],["Hammer_Curls","Curl a martello","Bicipiti","Manubri",0.667,["Stai in piedi con il busto eretto e un manubrio per mano a braccia tese, gomiti vicini al busto.","Tieni i palmi rivolti verso il busto: questa è la posizione di partenza.","Tenendo fermo il braccio superiore, espira e solleva il peso contraendo i bicipiti, muovendo solo l'avambraccio, finché il manubrio non è all'altezza della spalla; tieni la contrazione un momento.","Dopo la pausa, inspira e abbassa lentamente i manubri alla posizione di partenza.","Ripeti per il numero di ripetizioni previsto."],"Mantieni i palmi rivolti verso il busto per tutto il curl e i gomiti fermi, muovendo solo l'avambraccio."],["Hanging_Leg_Raise","Sollevamenti gambe alla sbarra","Addome","Corpo libero",0.667,["Appenditi a una sbarra con le braccia tese, presa larga o media, gambe distese e bacino leggermente ruotato indietro: questa è la posizione di partenza.","Solleva le gambe finché il busto non forma un angolo di 90 gradi con le gambe, espirando e tenendo la contrazione un secondo.","Torna lentamente alla posizione di partenza inspirando.","Ripeti per il numero di ripetizioni previsto."],"Ruota leggermente il bacino indietro ed evita lo slancio, per lavorare davvero gli addominali invece dei flessori dell'anca."],["Hyperextensions_Back_Extensions","Iperestensioni lombari","Lombari","Altro",0.667,["Sdraiati a faccia in giù su una panca per iperestensioni, con le caviglie ben bloccate sotto i cuscinetti.","Regola il cuscinetto superiore in modo che le cosce siano appoggiate al piano largo, lasciando spazio per piegarti sul bacino senza restrizioni.","Con il corpo dritto, incrocia le braccia davanti a te o dietro la testa: questa è la posizione di partenza.","Piegati lentamente in avanti sul bacino il più possibile mantenendo la schiena piatta, inspirando, finché non senti uno stiramento sui femorali, senza mai inarcare la schiena.","Risolleva lentamente il busto alla posizione iniziale inspirando, senza inarcare la schiena oltre la linea dritta né usare slancio.","Ripeti per il numero di ripetizioni previsto."],"Non inarcare mai la schiena durante il movimento: mantienila sempre piatta per proteggere la zona lombare."],["Incline_Cable_Flye","Croci ai cavi su panca inclinata","Petto","Cavi",0.667,["Imposta le carrucole al livello del pavimento, il più basso possibile rispetto al busto.","Metti una panca inclinata a 45 gradi tra le carrucole, seleziona il peso e afferra una maniglia per mano.","Sdraiati sulla panca inclinata e porta le mani a braccia tese davanti al viso: questa è la posizione di partenza.","Con una leggera flessione dei gomiti, apri le braccia lateralmente in un ampio arco finché non senti uno stiramento sul petto, inspirando.","Riporta le braccia alla posizione di partenza contraendo il petto ed espirando, tenendo la contrazione un secondo.","Ripeti il movimento per il numero di ripetizioni previsto."],"Mantieni i gomiti leggermente flessi e lascia che il movimento avvenga solo all'articolazione della spalla, per proteggere i tendini del bicipite."],["Incline_Dumbbell_Curl","Curl su panca inclinata","Bicipiti","Manubri",0.667,["Siediti su una panca inclinata con un manubrio per mano a braccia tese, gomiti vicini al busto e palmi rivolti in avanti: questa è la posizione di partenza.","Tenendo fermo il braccio superiore, solleva i pesi contraendo i bicipiti mentre espiri, muovendo solo gli avambracci, finché i bicipiti non sono completamente contratti e i manubri sono all'altezza delle spalle; tieni la contrazione un secondo.","Riporta lentamente i manubri alla posizione di partenza inspirando.","Ripeti per il numero di ripetizioni previsto."],"Mantieni i gomiti fermi vicino al busto, muovendo solo l'avambraccio, per isolare bene i bicipiti."],["Incline_Dumbbell_Flyes","Croci su panca inclinata (manubri)","Petto","Manubri",0.667,["Tieni un manubrio per mano e sdraiati su una panca inclinata a non più di 30 gradi.","Estendi le braccia sopra di te con una leggera flessione ai gomiti.","Ruota i polsi in modo che i palmi guardino verso di te: questa è la posizione di partenza.","Inspirando, abbassa lentamente le braccia lateralmente mantenendole distese e ruotando i polsi finché i palmi non si guardano.","Espirando, riporta i manubri in alto alla posizione di partenza invertendo il movimento e ruotando di nuovo i polsi.","Ripeti per il numero di ripetizioni previsto."],"Lascia che il movimento avvenga solo alla spalla e al polso, senza flettere i gomiti."],["Incline_Dumbbell_Press","Panca inclinata (manubri)","Petto","Manubri",0.667,["Sdraiati su una panca inclinata con un manubrio per mano sulle cosce, palmi l'uno verso l'altro.","Aiutandoti con le cosce, solleva i manubri uno alla volta portandoli all'altezza delle spalle.","Ruota i polsi in avanti finché i palmi non guardano lontano da te: questa è la posizione di partenza.","Mantenendo il pieno controllo dei manubri, espira e spingili verso l'alto con il petto.","Blocca le braccia in alto, tieni la contrazione un secondo e poi scendi lentamente, impiegando circa il doppio del tempo rispetto alla salita.","Ripeti il movimento per il numero di ripetizioni previsto.","Al termine, appoggia i manubri sulle cosce prima di posarli a terra: è il modo più sicuro per rilasciarli."],"Fai in modo che la discesa duri circa il doppio della salita, mantenendo sempre il pieno controllo dei manubri."],["Incline_Push-Up","Piegamenti inclinati","Petto","Corpo libero",0.667,["Mettiti di fronte a una panca o a una piattaforma rialzata stabile e appoggia le mani sul bordo, leggermente più larghe delle spalle.","Arretra i piedi con braccia e corpo dritti, perpendicolari al busto; mantenendo il corpo dritto, abbassa il petto verso il bordo piegando le braccia.","Spingi il corpo su finché le braccia non sono distese. Ripeti."],"Mantieni il corpo dritto e rigido per tutto il movimento, senza inarcare fianchi o schiena."],["Inverted_Row","Rematore inverso a corpo libero","Dorso","Altro",0.667,["Posiziona un bilanciere su un rack all'altezza del bacino, oppure usa una smith machine.","Afferra la barra con presa più larga delle spalle e mettiti sospeso sotto di essa, corpo dritto, talloni a terra, braccia completamente distese: questa è la posizione di partenza.","Piega i gomiti tirando il petto verso la barra, retraendo le scapole durante il movimento.","Fai una pausa in alto e torna alla posizione di partenza.","Ripeti per il numero di ripetizioni desiderato."],"Mantieni il corpo rigido e dritto dalla testa ai talloni durante tutto l'esercizio, come in un plank."],["JM_Press","JM press","Tricipiti","Bilanciere",0.667,["Parti come in una panca a presa stretta: sdraiati su una panca piana tenendo un bilanciere a braccia tese con i gomiti in dentro, ma con la barra allineata sopra la parte alta del petto: questa è la posizione di partenza.","Dalla posizione tesa, abbassa la barra come in un'estensione tricipiti sdraiato, inspirando; a metà percorso, lascia rotolare la barra indietro di circa 2-3 cm portando le braccia superiori verso le gambe finché non sono perpendicolari al busto, mantenendo costante l'angolo dei gomiti.","Espira e spingi la barra verso l'alto usando i tricipiti come in una panca a presa stretta.","Torna alla posizione di partenza e ricomincia.","Ripeti per il numero di ripetizioni previsto."],"Mantieni costante l'angolo dei gomiti durante la fase di rollio della barra, per non sovraccaricare le spalle."],["Kettlebell_One-Legged_Deadlift","Stacco a una gamba con kettlebell","Femorali","Kettlebell",0.669,["Tieni un kettlebell per il manico in una mano e stai in piedi sulla gamba dello stesso lato del kettlebell.","Mantenendo il ginocchio d'appoggio leggermente piegato, esegui uno stacco a gambe quasi tese piegandoti sul fianco ed estendendo la gamba libera indietro per l'equilibrio.","Continua ad abbassare il kettlebell finché non sei parallelo al pavimento, poi torna alla posizione eretta."],"Mantieni l'equilibrio estendendo la gamba libera indietro e tenendo la schiena piatta durante tutto il movimento."],["Kettlebell_Thruster","Thruster con kettlebell","Spalle","Kettlebell",0.669,["Porta due kettlebell alle spalle con un clean, estendendo gambe e fianchi mentre tiri i kettlebell verso le spalle e ruoti i polsi: questa è la posizione di partenza.","Inizia a scendere in squat flettendo fianchi e ginocchia, abbassando i fianchi tra le gambe, mantenendo la schiena dritta ed eretta.","In fondo, inverti il mov
