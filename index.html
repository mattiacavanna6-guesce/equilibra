// ================= FAMILY (household) — private per person unless they join the same family
// fdb/fid: the store and identity used for the family (claude.ai db + account id, or Firebase + anonymous id in the standalone site)
let hh=null,hhNames={},unsubs=[],fdb=null,fid=null;
let viewOnly=false;
const cloud=()=>!!(db&&myId&&!viewOnly);
const famOk=()=>!!(fdb&&fid);
const inFamily=()=>!!(S.profile.household&&famOk()&&hh&&(hh.members||[]).length>1);
const shopMode=()=>S.profile.household&&famOk()?"fam":cloud()?"cloud":"local";
const personalCol=()=>`data/users/${myId}/shop/items`;
const shopCol=()=>shopMode()==="fam"?`hh/${S.profile.household}/shopping`:personalCol();
const shopStore=()=>shopMode()==="fam"?fdb:db;
function newCode(){const a="abcdefghjkmnpqrstuvwxyz23456789";let s="";const r=new Uint32Array(12);(crypto.getRandomValues?crypto.getRandomValues(r):r.forEach((_,i)=>r[i]=Math.random()*1e9));r.forEach(x=>s+=a[x%a.length]);return s}
function onShopSnap(s){shopping=s.docs.map(d=>d.data()).filter(i=>i&&i.id).sort((a,b)=>(a.at||0)-(b.at||0));renderBg()}
function subscribeShared(){
  unsubs.forEach(u=>{try{u()}catch{}});unsubs=[];
  const mode=shopMode();
  if(mode==="local"){shopping=LS.get("shop",[]);hh=null;partnerMenus=[];renderBg();return}
  unsubs.push(shopStore().collection(shopCol()).onSnapshot(onShopSnap,e=>console.warn(e)));
  const h=S.profile.household;
  if(h&&mode==="fam"){
    unsubs.push(fdb.doc("hh/"+h).onSnapshot(s=>{if(s.metadata&&s.metadata.fromCache&&!s.exists)return;hh=s.exists?s.data():null;
      if(!hh||!(hh.members||[]).includes(fid)){toast("Non fai più parte della famiglia");S.profile.household=null;save("profile");subscribeShared()}
      else if(user&&!STANDALONE)user.profiles(hh.members).then(ps=>{hhNames=ps;renderBg()}).catch(()=>{});
      renderBg()},()=>{}));
    unsubs.push(fdb.collection(`hh/${h}/menus`).onSnapshot(s=>{partnerMenus=s.docs.map(d=>d.data()).filter(m=>m&&m.owner!==fid);renderBg()},()=>{}));
  }else{hh=null;partnerMenus=[]}
}
async function copyShopping(items,store,col){for(const i of items)await store.doc(`${col}/${i.id}`).set(i)}
async function moveShoppingToFamily(code){
  const open=shopping.filter(i=>!i.done);
  await copyShopping(open,fdb,`hh/${code}/shopping`);
  if(shopMode()==="cloud")for(const i of shopping)await db.doc(`${personalCol()}/${i.id}`).delete().catch(()=>{});
  else if(shopMode()==="local")LS.set("shop",[]);
}
const famErr=e=>(e&&(e.code||e.message))||"";
async function createFamily(){
  if(!famOk()){toast(STANDALONE?"La famiglia non è ancora attiva su questo sito":"Serve essere collegati con il proprio account");return}
  const id=newCode();
  try{await fdb.doc("hh/"+id).set({members:[fid],names:{[fid]:S.profile.name||""},owner:fid,at:Date.now()});await moveShoppingToFamily(id);
    S.profile.household=id;save("profile");subscribeShared();toast("Famiglia creata: condividi il codice")}catch(e){toast("Non riesco a creare la famiglia: "+famErr(e))}
  render();
}
async function joinFamily(code){
  code=String(code||"").trim().toLowerCase().replace(/[^a-z0-9]/g,"");
  if(code.length<8){toast("Codice non valido");return}
  if(!famOk()){toast("La famiglia non è disponibile qui");return}
  try{const s=await fdb.doc("hh/"+code).get();if(!s.exists){toast("Nessuna famiglia con questo codice");return}
    const d=s.data(),m=d.members||[];
    if(!m.includes(fid)){if(m.length>=6){toast("Questa famiglia è al completo");return}await fdb.doc("hh/"+code).update({members:[...m,fid],names:{...(d.names||{}),[fid]:S.profile.name||""}})}
    await moveShoppingToFamily(code);
    S.profile.household=code;save("profile");subscribeShared();toast("Sei entrato nella famiglia")}catch(e){toast("Non riesco a entrare: "+famErr(e))}
  render();
}
async function leaveFamily(){
  const h=S.profile.household;if(!h)return;
  const mine=shopping.filter(i=>!i.done);
  try{
    const s=await fdb.doc("hh/"+h).get();if(s.exists){const d=s.data(),names={...(d.names||{})};delete names[fid];await fdb.doc("hh/"+h).update({members:(d.members||[]).filter(x=>x!==fid),names})}
    const ms=await fdb.collection(`hh/${h}/menus`).get();for(const d of ms.docs){const v=d.data();if(v.owner===fid)await fdb.doc(`hh/${h}/menus/${d.id}`).delete().catch(()=>{})}
  }catch(e){}
  S.profile.household=null;hh=null;partnerMenus=[];save("profile");
  if(cloud()){try{await copyShopping(mine,db,personalCol())}catch(e){}}else LS.set("shop",mine);
  subscribeShared();toast("Sei uscito dalla famiglia: hai una copia personale della lista");render();
}

// Firebase (compat SDK, self-hosted in vendor/) wrapped with the same small API the app uses for claude.ai's db
function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=()=>ko(new Error("load "+src));document.head.appendChild(s)})}
async function initFirebase(){
  for(const f of ["firebase-app-compat.js","firebase-auth-compat.js","firebase-firestore-compat.js"])await loadScript("vendor/"+f);
  const app=firebase.initializeApp(FIREBASE);
  const cred=await firebase.auth(app).signInAnonymously();
  const fs=firebase.firestore(app);
  const snap=s=>({exists:s.exists,data:()=>s.data(),metadata:s.metadata});
  const q=qs=>({docs:qs.docs.map(d=>({id:d.id,data:()=>d.data()}))});
  const doc=p=>({get:async()=>snap(await fs.doc(p).get()),set:d=>fs.doc(p).set(d),update:d=>fs.doc(p).update(d),delete:()=>fs.doc(p).delete(),onSnapshot:(fn,err)=>fs.doc(p).onSnapshot(s=>fn(snap(s)),err)});
  const collection=p=>({doc:id=>doc(p+"/"+id),get:async()=>q(await fs.collection(p).get()),onSnapshot:(fn,err)=>fs.collection(p).onSnapshot(s=>fn(q(s)),err)});
  fdb={doc,collection};fid=cred.user.uid;
}
async function saveFile(filename,blob){
  const dl=!STANDALONE?await window.claude?.use?.("downloads").catch(()=>null):null;
  if(dl){await dl.save({filename,data:blob});return}
  const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);
}

    case "rchip":{const n=+b.dataset.v;range.from=today();range.to=n<0?addDays(mondayOf(today()),6):addDays(today(),n);refreshModal("rangeModal",rangeHTML);break}
    case "applyRange":applyRange();break;
  }
});
function readProfile(){document.querySelectorAll("[data-p]").forEach(el=>{S.profile[el.dataset.p]=el.type==="number"?num(el.value):el.value})}
function readPlanForm(){const f={};document.querySelectorAll("[data-pf]").forEach(el=>f[el.dataset.pf]=el.value);S.nutrition.planForm=f;save("nutrition")}
document.addEventListener("input",ev=>{
  const el=ev.target,I=+el.dataset.i;
  if(el.dataset.set){active.ex[I].sets[+el.dataset.j][el.dataset.set]=el.value;persistActive();return}
  if(el.dataset.aex){active.ex[I][el.dataset.aex]=el.value;persistActive();return}
  if(el.dataset.aw){active[el.dataset.aw]=el.value;persistActive();return}
  if(el.dataset.edit){editing[el.dataset.edit]=el.value;return}
  if(el.dataset.edex){editing.ex[I][el.dataset.edex]=el.value;return}
  const k=el.dataset.input;
  if(k==="pickq"){pickQ=el.value;$("#picklist").innerHTML=pickItems().map(e=>exRow(e,"pick")).join("");return}
  if(k==="libq"){libQ=el.value;$("#liblist").innerHTML=libItems().map(e=>exRow(e,"exDetail")).join("");return}
  if(k==="foodq"){foodQ=el.value;$("#foodres").innerHTML=foodResults();return}
  if(k==="fgrams"){foodPick.g=el.value;const f=FOODBY[foodPick.name.toLowerCase()],q=num(el.value)/100;$("#fprev").textContent=`${r0(f.kcal*q)} kcal · P ${r1(f.p*q)} · C ${r1(f.c*q)} · G ${r1(f.f*q)}`;return}
  if(k==="shopq"){const q=parseShop(el.value).name;const box=$("#shopSugg");if(q.length<2){box.innerHTML="";return}
    const names=[...new Set([...Object.values(SHOP_CATS).flat().filter(n=>norm(n).startsWith(norm(q))),...searchFoods(q,8).map(f=>cleanName(f.name))])].slice(0,6);
    const pre=el.value.slice(0,el.value.length-q.length);
    box.innerHTML=names.length?`<div class="chips" style="margin-top:8px">${names.map(n=>`<button class="chip" data-act="sugg" data-name="${esc(pre+n)}">${esc(n)}</button>`).join("")}</div>`:"";return}
});
document.addEventListener("change",async ev=>{
  const el=ev.target;
  if(el.dataset.range){range[el.dataset.range]=el.type==="checkbox"?el.checked:el.value;if(range.to<range.from)range.to=range.from;refreshModal("rangeModal",rangeHTML);return}
  if(el.dataset.share){LS.set("share."+el.dataset.share,el.value);return}
  if(el.id==="gemModel"){LS.set("gemmodel",el.value);return}
  if(el.dataset.aex==="rest"){active.ex[+el.dataset.i].rest=+el.value;persistActive();return}
  if(el.id==="importFile"&&el.files[0]){try{const d=JSON.parse(await el.files[0].text());for(const k of Object.keys(S))if(d[k]){S[k]={...S[k],...d[k]}}S.training.workouts.forEach(w=>markW(w.date));Object.keys(S.nutrition.log).forEach(markL);Object.keys(S).forEach(save);toast("Dati importati");render()}catch{toast("File non valido")}}
});
document.addEventListener("keydown",ev=>{
  const id=ev.target.id;
  if(ev.key==="Enter"&&id==="shopIn"){ev.preventDefault();$('[data-act="addShop"]').click()}
  if(ev.key==="Enter"&&!ev.shiftKey&&id.startsWith("chatIn_")&&window.innerWidth>760){ev.preventDefault();$(`[data-act="sendChat"][data-k="${id.slice(7)}"]`).click()}
  if(ev.key==="Escape"){const o=[...document.querySelectorAll(".overlay")].pop();if(o&&o.id!=="workoutModal"){closeModal(o.id);render()}}
});
document.addEventListener("toggle",e=>{if(e.target.id==="wDet")LS.set("wOpen",e.target.open)},true);
function applyTheme(){const t=LS.get("theme","auto");if(t==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",t)}

// ================= BOOT
function migrateMenu(){const n=S.nutrition;if(n.menu){n.menus=n.menus||{};if(n.menu.weekStart)n.menus[n.menu.weekStart]=n.menu;delete n.menu;return true}n.menus=n.menus||{};return false}
async function boot(){
  applyTheme();
  for(const k of Object.keys(S)){const v=LS.get("s."+k,null);if(v)S[k]={...S[k],...v}}
  migrateMenu();sortWorkouts();shopping=LS.get("shop",[]);
  render();micFab();
  if(active&&!$("#workoutModal"))render();
  if(STANDALONE){
    sample=makeGemini();booted=true;subscribeShared();render();
    if(FIREBASE)initFirebase().then(()=>{subscribeShared();render()}).catch(e=>{console.warn(e)});
    if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
    return;
  }
  const cl=window.claude;if(!cl||!cl.use){booted=true;render();return}
  [db,user,sample]=await Promise.all(["db","user","sample"].map(n=>cl.use(n).catch(()=>null)));
  myId=user?await user.id():null;
  try{if(user&&myId&&(await user.can("data.write"))===false)viewOnly=true}catch(e){}
  try{if(user)meInfo=await user.me()}catch(e){meInfo=null}
  booted=true;
  if(db&&myId&&!viewOnly){try{const pend=await loadRemote();remoteReady=true;if(migrateMenu())pend.push("nutrition");[...new Set(pend)].forEach(enqueue)}catch(e){console.warn(e);toast("Non riesco a leggere i dati dal tuo account: per ora le modifiche restano su questo dispositivo. Ricarica più tardi.")}}
  if(cloud()){
    fdb=db;fid=myId;
    const localShop=LS.get("shop",[]);
    // one-time: items from the old page-wide list go to the owner's own list
    try{if(await user.isOwner()){const g=await db.collection("shopping").get();for(const d of g.docs){await db.doc(`${personalCol()}/${d.id}`).set(d.data());await db.doc("shopping/"+d.id).delete()}}}catch(e){}
    if(localShop.length){for(const i of localShop)await shopStore().doc(`${shopCol()}/${i.id}`).set(i).catch(()=>{});LS.set("shop",[])}
    subscribeShared();
  }
  render();
}
boot();
